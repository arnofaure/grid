/* ---------------------------------------------------------------------
   COPY / PASTE — duplicates whichever element is selected (image or
   text alike). Uses an in-app clipboard variable rather than the real
   OS clipboard: simpler, and it means Cmd+C/Cmd+V over a text block
   that's mid-edit can still fall through to the browser's own text
   copy/paste (see the keydown guard below) without any conflict.
--------------------------------------------------------------------- */
let elementClipboard = null;
function copySelectedElement(){
  const el = state.selectedId ? getElement(state.selectedId) : null;
  if(!el){ toast('Nothing selected to copy'); return; }
  elementClipboard = JSON.parse(JSON.stringify(el));
  toast('Copied');
}
function pasteElement(){
  if(!elementClipboard){ toast('Nothing to paste'); return; }
  pushHistory();
  const copy = JSON.parse(JSON.stringify(elementClipboard));
  copy.id = uid();
  // Offset so the paste is visibly a new block, not silently stacked
  // exactly on top of the original; clamp back onto the page if that
  // would push it off the edge (e.g. pasting near a corner repeatedly).
  const offset = 24;
  copy.x = clamp(copy.x + offset, 0, Math.max(0, state.canvasW - copy.w));
  copy.y = clamp(copy.y + offset, 0, Math.max(0, state.canvasH - copy.h));
  state.elements.push(copy);
  state.selectedId = copy.id;
  renderAll();
  // Repeated Cmd+V keeps cascading from the latest paste rather than
  // restacking on the original every time.
  elementClipboard = copy;
}

document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const editable = document.activeElement && document.activeElement.isContentEditable;
  const meta = e.metaKey || e.ctrlKey;

  // Undo/redo/copy/paste work everywhere except while actively typing
  // in a text block or a form field, where these should do the
  // browser's native text editing instead of acting on the whole page.
  if(meta && !editable && tag !== 'INPUT' && tag !== 'TEXTAREA'){
    if(e.key.toLowerCase() === 'z' && e.shiftKey){ e.preventDefault(); redo(); return; }
    if(e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); return; }
    if(e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
    if(e.key.toLowerCase() === 'c'){ e.preventDefault(); copySelectedElement(); return; }
    if(e.key.toLowerCase() === 'v'){ e.preventDefault(); pasteElement(); return; }
    if(e.key === '=' || e.key === '+'){ e.preventDefault(); setZoomMultiplier(zoomMultiplier + 0.1); return; }
    if(e.key === '-'){ e.preventDefault(); setZoomMultiplier(zoomMultiplier - 0.1); return; }
    if(e.key === '0'){ e.preventDefault(); setZoomMultiplier(1); return; }
  }

  if(editable || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT'){
    if(e.key === 'Escape' && editable && document.activeElement.__exitEdit){
      document.activeElement.blur();
    }
    return;
  }
  if(e.key === 'Delete' || e.key === 'Backspace'){
    if(state.multiSelectIds.length > 1){ e.preventDefault(); deleteMultiSelected(); }
    else if(state.selectedId){ e.preventDefault(); deleteElement(state.selectedId); }
  }
  if(e.key === 'Escape'){
    if(activeCropEl){ const box = document.getElementById('box-' + activeCropEl); if(box) exitCropMode(box); }
    selectElement(null, true);
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    const ids = state.multiSelectIds.length > 1 ? state.multiSelectIds : (state.selectedId ? [state.selectedId] : []);
    if(ids.length){
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
      const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
      pushHistory();
      ids.forEach(id => {
        const el = getElement(id);
        if(!el) return;
        el.x = clamp(el.x + dx, -state.bleed, state.canvasW + state.bleed - el.w);
        el.y = clamp(el.y + dy, -state.bleed, state.canvasH + state.bleed - el.h);
      });
      renderElementPositions();
      renderPropsPanel();
    }
  }
  if(e.key.toLowerCase() === 'g' && !meta){
    e.preventDefault();
    pushHistory();
    state.grid.showGrid = !state.grid.showGrid;
    renderStage();
    if(!state.selectedId) renderPropsPanel();
    toast('Grid ' + (state.grid.showGrid ? 'shown' : 'hidden'));
  }
  if(e.key.toLowerCase() === 'm' && !meta){
    e.preventDefault();
    pushHistory();
    state.grid.showMargins = !state.grid.showMargins;
    renderStage();
    if(!state.selectedId) renderPropsPanel();
    toast('Margins ' + (state.grid.showMargins ? 'shown' : 'hidden'));
  }
});

/* ---------------------------------------------------------------------
   EXPORT
--------------------------------------------------------------------- */
function pixelExportDims(includeBleed){
  const bleed = includeBleed ? (state.bleed || 0) : 0;
  const totalW = state.canvasW + bleed*2, totalH = state.canvasH + bleed*2;
  if(state.canvasUnit === 'px') return { w: Math.round(totalW), h: Math.round(totalH) };
  const pxPerUnit = UNIT_TO_PX[state.canvasUnit] * (EXPORT_DPI / 96);
  return { w: Math.round(totalW * pxPerUnit), h: Math.round(totalH * pxPerUnit) };
}

async function exportPNG(includeGuides, transparent, includeBleed){
  const dims = pixelExportDims(includeBleed);
  const bleed = includeBleed ? (state.bleed || 0) : 0;
  const scale = dims.w / (state.canvasW + bleed*2);
  const offset = bleed * scale; // shifts trim-space (0,0) to its position within the (possibly larger) bleed canvas
  const canvas = document.createElement('canvas');
  canvas.width = dims.w; canvas.height = dims.h;
  const ctx = canvas.getContext('2d');

  if(!transparent){ ctx.fillStyle = state.bgColor; ctx.fillRect(0,0,dims.w,dims.h); }

  for(const el of state.elements){
    if(el.visible === false) continue;
    const x = offset + el.x*scale, y = offset + el.y*scale, w = el.w*scale, h = el.h*scale;
    // Rotate the canvas itself around the element's center rather than
    // teaching drawImageFitted/drawTextElement about rotation — they
    // keep drawing into the same unrotated x/y/w/h rect either way.
    ctx.save();
    if(el.rotation){
      const cx = x + w/2, cy = y + h/2;
      ctx.translate(cx, cy);
      ctx.rotate(el.rotation * Math.PI/180);
      ctx.translate(-cx, -cy);
    }
    if(el.type === 'image' && el.src){
      await drawImageFitted(ctx, el, x, y, w, h);
    } else if(el.type === 'text'){
      await drawTextElement(ctx, el, x, y, w, h, scale);
    } else if(el.type === 'shape'){
      drawShapeElement(ctx, el, x, y, w, h, scale);
    }
    ctx.restore();
  }

  if(includeGuides) drawGuidesOnCanvas(ctx, scale, offset);
  // The trim line is reference-only (like the other guides) — it should
  // never bake a visible pink dash into an actual print-ready file, so
  // it rides on the same "include guides" checkbox, not on the bleed
  // checkbox alone.
  if(includeGuides && includeBleed && bleed > 0) drawBleedGuideOnCanvas(ctx, scale, offset);

  canvas.toBlob(blob => downloadBlob(blob, `grid-page-${dims.w}x${dims.h}.png`));
}

function drawBleedGuideOnCanvas(ctx, scale, offset){
  ctx.save();
  ctx.strokeStyle = '#d64d8a';
  ctx.lineWidth = Math.max(1, scale*1.5);
  ctx.setLineDash([scale*2, scale*4]);
  ctx.strokeRect(offset, offset, state.canvasW*scale, state.canvasH*scale);
  ctx.restore();
}

function drawImageFitted(ctx, el, x, y, w, h){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      ctx.save();
      ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const boxRatio = w/h, imgRatio = iw/ih;
      let dw, dh, dx, dy;
      if(el.fit === 'fill'){ dw = w; dh = h; dx = x; dy = y; }
      else if((el.fit === 'cover') === (imgRatio > boxRatio)){
        // cover+wide-image, or contain+tall-image -> fit by height
        dh = h; dw = h*imgRatio;
        dx = x - (dw-w) * (el.panX/100); dy = y;
      } else {
        dw = w; dh = w/imgRatio;
        dx = x; dy = y - (dh-h) * (el.panY/100);
      }
      // Zoom scales the already-fitted rect around the same pan pivot
      // point the crop tool uses on screen, so export matches preview.
      // rotationCoverScale adds exactly the extra scale a WxH frame
      // needs to stay fully covered once rotated (see applyImageStyle) —
      // without it, rotated exports would show corner gaps the on-screen
      // preview no longer has.
      const zoom = (el.zoom || 1) * rotationCoverScale(w, h, el.imgRotation || 0);
      const pivotX = x + w*(el.panX/100), pivotY = y + h*(el.panY/100);
      if(zoom !== 1){
        const fxr = dw !== 0 ? (pivotX-dx)/dw : 0.5, fyr = dh !== 0 ? (pivotY-dy)/dh : 0.5;
        const dw2 = dw*zoom, dh2 = dh*zoom;
        dx = pivotX - fxr*dw2; dy = pivotY - fyr*dh2;
        dw = dw2; dh = dh2;
      }
      // Content rotation spins only the photo around that same pivot —
      // the clip rect above (the frame) was already applied unrotated,
      // so the crop boundary stays put while the picture turns inside it.
      if(el.imgRotation){
        ctx.translate(pivotX, pivotY);
        ctx.rotate(el.imgRotation * Math.PI/180);
        ctx.translate(-pivotX, -pivotY);
      }
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
      resolve();
    };
    img.onerror = () => resolve();
    img.src = el.src;
  });
}

function shapePath(ctx, el, x, y, w, h){
  ctx.beginPath();
  if(el.shapeType === 'ellipse'){
    ctx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, Math.PI*2);
  } else if(el.shapeType === 'diamond'){
    ctx.moveTo(x+w/2, y); ctx.lineTo(x+w, y+h/2); ctx.lineTo(x+w/2, y+h); ctx.lineTo(x, y+h/2); ctx.closePath();
  } else {
    ctx.rect(x, y, w, h);
  }
}
function drawShapeElement(ctx, el, x, y, w, h, scale){
  shapePath(ctx, el, x, y, w, h);
  if(el.fillColor && el.fillColor !== 'transparent'){ ctx.fillStyle = el.fillColor; ctx.fill(); }
  const sw = (el.strokeWidth || 0) * scale;
  if(sw > 0.01){
    ctx.lineWidth = sw;
    ctx.strokeStyle = el.strokeColor || '#000000';
    ctx.stroke();
  }
}

async function drawTextElement(ctx, el, x, y, w, h, scale){
  const family = el.googleFont || (el.fontFamily || 'sans-serif').split(',')[0].replace(/"/g,'');
  const fontSize = el.fontSize * scale;
  const weightStyle = (el.italic ? 'italic ' : '') + el.weight + ' ' + fontSize + 'px "' + family + '"';
  try{ await document.fonts.load(weightStyle); }catch(e){}
  // Clip to the frame like the on-screen .el-text-clip does, so text
  // that doesn't fit (long content, autoFit off) is cropped in the
  // export instead of spilling into whatever's drawn next.
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.font = weightStyle;
  ctx.fillStyle = el.color;
  ctx.textBaseline = 'top';
  const lineHeightPx = fontSize * el.lineHeight;
  // Word-wrap each explicit paragraph (split on the real line breaks the
  // user typed) separately, instead of collapsing the whole block into
  // one run of words first — otherwise an intentional blank line or
  // paragraph break the user typed would silently disappear on export.
  const paragraphs = (el.content || '').split('\n');
  const lines = [];
  paragraphs.forEach(para => {
    const words = para.split(/\s+/).filter(w => w.length);
    if(words.length === 0){ lines.push(''); return; }
    let cur = '';
    words.forEach(word => {
      const test = cur ? cur + ' ' + word : word;
      if(ctx.measureText(test).width > w && cur){ lines.push(cur); cur = word; }
      else cur = test;
    });
    if(cur) lines.push(cur);
  });

  const totalH = lines.length * lineHeightPx;
  let startY = y;
  if(el.vAlign === 'middle') startY = y + (h - totalH)/2;
  else if(el.vAlign === 'bottom') startY = y + (h - totalH);

  // "Justify" spreads every wrapped line evenly from the top edge to
  // the bottom edge (first line flush top, last line flush bottom) —
  // a reasonable raster approximation of the flex space-between layout
  // used on screen/in the PDF export, which spreads paragraphs rather
  // than individually-wrapped lines.
  const useSpread = el.vAlign === 'justify' && lines.length > 1;
  const gap = useSpread ? (h - lineHeightPx) / (lines.length - 1) : lineHeightPx;
  const rowY = useSpread ? y : startY;

  lines.forEach((line, i) => {
    let lx = x;
    const lineW = ctx.measureText(line).width;
    if(el.align === 'center') lx = x + (w-lineW)/2;
    if(el.align === 'right') lx = x + (w-lineW);
    ctx.fillText(line, lx, rowY + i*gap);
  });
  ctx.restore();
}

function drawGuidesOnCanvas(ctx, scale, offset){
  offset = offset || 0;
  const g = state.grid, geo = computeGrid();
  ctx.save();
  ctx.lineWidth = Math.max(0.5, scale*0.75);
  ctx.strokeStyle = '#4F9C8F';
  geo.colBounds.forEach(c => {
    [c.start, c.end].forEach(cx => {
      ctx.beginPath(); ctx.moveTo(offset+cx*scale, offset+g.marginTop*scale); ctx.lineTo(offset+cx*scale, offset+(state.canvasH-g.marginBottom)*scale); ctx.stroke();
    });
  });
  geo.rowBounds.forEach(r => {
    [r.start, r.end].forEach(ry => {
      ctx.beginPath(); ctx.moveTo(offset+g.marginLeft*scale, offset+ry*scale); ctx.lineTo(offset+(state.canvasW-g.marginRight)*scale, offset+ry*scale); ctx.stroke();
    });
  });
  ctx.restore();
}

function buildExportSVG(includeGuides, transparent, includeBleed){
  const w = state.canvasW, h = state.canvasH;
  const bleed = includeBleed ? (state.bleed || 0) : 0;
  const doc = document.implementation.createDocument(SVGNS, 'svg', null);
  const svg = doc.documentElement;
  svg.setAttribute('xmlns', SVGNS);
  svg.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
  const suffix = state.canvasUnit === 'px' ? '' : state.canvasUnit;
  svg.setAttribute('width', (w+bleed*2) + suffix);
  svg.setAttribute('height', (h+bleed*2) + suffix);
  // Every element/guide below is still authored in plain 0..w/0..h
  // canvas coordinates — shifting the viewBox's own origin to -bleed is
  // enough to reveal that extra margin without touching any of them.
  svg.setAttribute('viewBox', `${-bleed} ${-bleed} ${w+bleed*2} ${h+bleed*2}`);

  if(!transparent){
    const bg = doc.createElementNS(SVGNS, 'rect');
    bg.setAttribute('x',-bleed); bg.setAttribute('y',-bleed);
    bg.setAttribute('width',w+bleed*2); bg.setAttribute('height',h+bleed*2);
    bg.setAttribute('fill', state.bgColor);
    svg.appendChild(bg);
  }
  if(includeGuides && bleed > 0){
    const trimRect = doc.createElementNS(SVGNS, 'rect');
    trimRect.setAttribute('x',0); trimRect.setAttribute('y',0);
    trimRect.setAttribute('width',w); trimRect.setAttribute('height',h);
    trimRect.setAttribute('fill','none'); trimRect.setAttribute('stroke','#d64d8a');
    trimRect.setAttribute('stroke-width', 1.5); trimRect.setAttribute('stroke-dasharray','2 4');
    svg.appendChild(trimRect);
  }

  state.elements.forEach(el => {
    if(el.visible === false) return;
    // A rotated element gets wrapped in its own <g rotate(...)> around
    // its center — clip-path coordinates are evaluated in that same
    // (now-rotated) local space, so the crop frame and the image inside
    // it keep matching and simply rotate together as one rigid unit.
    let target = svg;
    if(el.rotation){
      const cx = fx(el.x + el.w/2), cy = fx(el.y + el.h/2);
      target = doc.createElementNS(SVGNS, 'g');
      target.setAttribute('transform', `rotate(${fx(el.rotation)} ${cx} ${cy})`);
      svg.appendChild(target);
    }
    if(el.type === 'image' && el.src){
      const clipId = 'clip-' + el.id;
      const clipPath = doc.createElementNS(SVGNS, 'clipPath'); clipPath.setAttribute('id', clipId);
      const clipRect = doc.createElementNS(SVGNS, 'rect');
      clipRect.setAttribute('x', fx(el.x)); clipRect.setAttribute('y', fx(el.y));
      clipRect.setAttribute('width', fx(el.w)); clipRect.setAttribute('height', fx(el.h));
      clipPath.appendChild(clipRect); target.appendChild(clipPath);

      const img = doc.createElementNS(SVGNS, 'image');
      img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', el.src);
      img.setAttribute('x', fx(el.x)); img.setAttribute('y', fx(el.y));
      img.setAttribute('width', fx(el.w)); img.setAttribute('height', fx(el.h));
      // SVG's preserveAspectRatio only offers 9 fixed alignments, not an
      // arbitrary pan percentage — snap panX/panY to the nearest one as
      // a reasonable approximation of the on-screen crop.
      const xAlign = el.panX < 33 ? 'xMin' : el.panX > 66 ? 'xMax' : 'xMid';
      const yAlign = el.panY < 33 ? 'YMin' : el.panY > 66 ? 'YMax' : 'YMid';
      img.setAttribute('preserveAspectRatio', el.fit === 'fill' ? 'none' : (xAlign+yAlign) + (el.fit === 'contain' ? ' meet' : ' slice'));
      img.setAttribute('clip-path', `url(#${clipId})`);
      const zoom = (el.zoom || 1) * rotationCoverScale(el.w, el.h, el.imgRotation || 0);
      if(zoom !== 1 || el.imgRotation){
        const pivotX = fx(el.x + el.w*(el.panX/100)), pivotY = fx(el.y + el.h*(el.panY/100));
        const rot = el.imgRotation ? `rotate(${fx(el.imgRotation)} ${pivotX} ${pivotY}) ` : '';
        img.setAttribute('transform', `${rot}translate(${pivotX} ${pivotY}) scale(${zoom}) translate(${-pivotX} ${-pivotY})`);
      }
      target.appendChild(img);
    } else if(el.type === 'text'){
      const fo = doc.createElementNS(SVGNS, 'foreignObject');
      fo.setAttribute('x', fx(el.x)); fo.setAttribute('y', fx(el.y));
      fo.setAttribute('width', fx(el.w)); fo.setAttribute('height', fx(el.h));
      const outer = doc.createElementNS(HTMLNS, 'div');
      outer.setAttribute('xmlns', HTMLNS);
      const vAlignCSS = { top:'flex-start', middle:'center', bottom:'flex-end', justify:'space-between' };
      outer.setAttribute('style', `width:100%; height:100%; overflow:hidden; display:flex; flex-direction:column; ` +
        `justify-content:${vAlignCSS[el.vAlign] || 'flex-start'};`);
      const family = el.googleFont ? `"${el.googleFont}", ${el.fontFamily||'sans-serif'}` : (el.fontFamily||'sans-serif');
      const textStyle = `font-family:${family}; font-size:${el.fontSize}px; line-height:${el.lineHeight}; ` +
        `letter-spacing:${el.letterSpacing}px; font-weight:${el.weight}; font-style:${el.italic?'italic':'normal'}; ` +
        `text-align:${el.align}; color:${el.color}; width:100%; white-space:pre-wrap; word-wrap:break-word; margin:0;`;
      const paragraphs = el.vAlign === 'justify' ? (el.content || '').split('\n') : [el.content || ''];
      paragraphs.forEach(p => {
        const div = doc.createElementNS(HTMLNS, 'div');
        div.setAttribute('xmlns', HTMLNS);
        div.setAttribute('style', textStyle);
        div.textContent = p.length ? p : ' ';
        outer.appendChild(div);
      });
      fo.appendChild(outer);
      target.appendChild(fo);
    } else if(el.type === 'shape'){
      let shapeEl;
      if(el.shapeType === 'ellipse'){
        shapeEl = doc.createElementNS(SVGNS, 'ellipse');
        shapeEl.setAttribute('cx', fx(el.x + el.w/2)); shapeEl.setAttribute('cy', fx(el.y + el.h/2));
        shapeEl.setAttribute('rx', fx(el.w/2)); shapeEl.setAttribute('ry', fx(el.h/2));
      } else if(el.shapeType === 'diamond'){
        shapeEl = doc.createElementNS(SVGNS, 'polygon');
        const pts = [[el.x+el.w/2, el.y], [el.x+el.w, el.y+el.h/2], [el.x+el.w/2, el.y+el.h], [el.x, el.y+el.h/2]];
        shapeEl.setAttribute('points', pts.map(p => fx(p[0])+','+fx(p[1])).join(' '));
      } else {
        shapeEl = doc.createElementNS(SVGNS, 'rect');
        shapeEl.setAttribute('x', fx(el.x)); shapeEl.setAttribute('y', fx(el.y));
        shapeEl.setAttribute('width', fx(el.w)); shapeEl.setAttribute('height', fx(el.h));
      }
      shapeEl.setAttribute('fill', el.fillColor || 'none');
      if(el.strokeWidth > 0){
        shapeEl.setAttribute('stroke', el.strokeColor || '#000000');
        shapeEl.setAttribute('stroke-width', el.strokeWidth);
      }
      target.appendChild(shapeEl);
    }
  });

  if(includeGuides){
    const g = state.grid, geo = computeGrid();
    const gg = doc.createElementNS(SVGNS, 'g');
    gg.setAttribute('stroke', '#4F9C8F'); gg.setAttribute('stroke-width', '0.75'); gg.setAttribute('fill','none');
    geo.colBounds.forEach(c => {
      [c.start, c.end].forEach(cx => {
        const l = doc.createElementNS(SVGNS,'line');
        l.setAttribute('x1',fx(cx)); l.setAttribute('y1',fx(g.marginTop)); l.setAttribute('x2',fx(cx)); l.setAttribute('y2',fx(h-g.marginBottom));
        gg.appendChild(l);
      });
    });
    geo.rowBounds.forEach(r => {
      [r.start, r.end].forEach(ry => {
        const l = doc.createElementNS(SVGNS,'line');
        l.setAttribute('x1',fx(g.marginLeft)); l.setAttribute('y1',fx(ry)); l.setAttribute('x2',fx(w-g.marginRight)); l.setAttribute('y2',fx(ry));
        gg.appendChild(l);
      });
    });
    svg.appendChild(gg);
  }

  return svg;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

const exportModal = document.getElementById('export-modal');
document.getElementById('btn-export').addEventListener('click', () => {
  document.getElementById('export-bleed-row').hidden = !(state.bleed > 0);
  exportModal.classList.add('show');
});
document.getElementById('export-cancel').addEventListener('click', () => exportModal.classList.remove('show'));
document.getElementById('export-svg').addEventListener('click', () => {
  const includeGuides = document.getElementById('export-guides').checked;
  const transparent = document.getElementById('export-transparent').checked;
  const includeBleed = state.bleed > 0 && document.getElementById('export-bleed').checked;
  const svg = buildExportSVG(includeGuides, transparent, includeBleed);
  const xml = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([xml], {type:'image/svg+xml'});
  downloadBlob(blob, `grid-page-${fmtDim(state.canvasW)}x${fmtDim(state.canvasH)}${state.canvasUnit}.svg`);
  exportModal.classList.remove('show');
  toast('SVG exported');
});
document.getElementById('export-png').addEventListener('click', async () => {
  const includeGuides = document.getElementById('export-guides').checked;
  const transparent = document.getElementById('export-transparent').checked;
  const includeBleed = state.bleed > 0 && document.getElementById('export-bleed').checked;
  await exportPNG(includeGuides, transparent, includeBleed);
  exportModal.classList.remove('show');
  toast('PNG exported');
});

/* ---------------------------------------------------------------------
   PDF EXPORT — via the browser's native print-to-PDF instead of
   rasterizing. PNG/SVG both end up with text either baked into pixels
   (PNG) or wrapped in a <foreignObject> that many non-browser SVG
   consumers render inconsistently (Illustrator, Affinity...); printing
   real HTML keeps every text block as actual selectable/copyable text
   in the resulting PDF, exactly like printing a normal web page. A
   dedicated #print-root (hidden on screen, shown only in @media print,
   see CSS) is rebuilt fresh from the current state each time so it
   never drifts from what's on the page.
--------------------------------------------------------------------- */
function applyShapeStylePrint(box, el, suffix){
  box.style.background = el.fillColor || 'transparent';
  const sw = refPx(el.strokeWidth || 0);
  box.style.border = sw > 0.01 ? (sw + suffix + ' solid ' + (el.strokeColor || '#000000')) : 'none';
  box.style.borderRadius = el.shapeType === 'ellipse' ? '50%' : '0';
  box.style.clipPath = el.shapeType === 'diamond' ? 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)' : 'none';
}

function buildPrintPage(includeBleed){
  const root = document.getElementById('print-root');
  root.innerHTML = '';
  const suffix = state.canvasUnit === 'px' ? 'px' : state.canvasUnit;
  const bleed = includeBleed ? (state.bleed || 0) : 0;
  const totalW = state.canvasW + bleed*2, totalH = state.canvasH + bleed*2;

  const styleTag = document.createElement('style');
  styleTag.id = 'print-page-size';
  styleTag.textContent = `@page{ size: ${fmtDim(totalW)}${suffix} ${fmtDim(totalH)}${suffix}; margin:0; }`;
  root.appendChild(styleTag);

  const page = document.createElement('div');
  page.className = 'print-page';
  page.style.width = fmtDim(totalW) + suffix;
  page.style.height = fmtDim(totalH) + suffix;
  page.style.background = state.bgColor;

  // Elements stay authored in plain 0..canvasW/H coordinates; a trim
  // wrapper inset by the bleed amount (mirroring #trim-frame on screen)
  // is all that's needed to reveal that extra margin around them.
  const trim = document.createElement('div');
  trim.style.cssText = `position:absolute; left:${fx(bleed)}${suffix}; top:${fx(bleed)}${suffix}; ` +
    `width:${fx(state.canvasW)}${suffix}; height:${fx(state.canvasH)}${suffix};`;
  page.appendChild(trim);

  state.elements.forEach(el => {
    if(el.visible === false) return;
    const box = document.createElement('div');
    box.className = 'print-el';
    box.style.left = fx(el.x) + suffix;
    box.style.top = fx(el.y) + suffix;
    box.style.width = fx(el.w) + suffix;
    box.style.height = fx(el.h) + suffix;
    if(el.rotation) box.style.transform = `rotate(${el.rotation}deg)`;

    if(el.type === 'image' && el.src){
      const clip = document.createElement('div'); clip.className = 'print-clip';
      const img = document.createElement('img');
      img.src = el.src;
      img.style.objectFit = el.fit;
      img.style.objectPosition = el.panX + '% ' + el.panY + '%';
      img.style.transformOrigin = el.panX + '% ' + el.panY + '%';
      img.style.transform = 'rotate(' + (el.imgRotation || 0) + 'deg) scale(' + ((el.zoom || 1) * rotationCoverScale(el.w, el.h, el.imgRotation || 0)) + ')';
      clip.appendChild(img);
      box.appendChild(clip);
    } else if(el.type === 'text'){
      ensureGoogleFont(el.googleFont);
      const family = el.googleFont ? `"${el.googleFont}", ${el.fontFamily||'sans-serif'}` : (el.fontFamily||'sans-serif');
      const vAlignCSS = { top:'flex-start', middle:'center', bottom:'flex-end', justify:'space-between' };
      box.style.display = 'flex';
      box.style.flexDirection = 'column';
      box.style.justifyContent = vAlignCSS[el.vAlign] || 'flex-start';
      const paragraphs = el.vAlign === 'justify' ? (el.content || '').split('\n') : [el.content || ''];
      paragraphs.forEach(p => {
        const txt = document.createElement('div');
        txt.className = 'print-text';
        txt.textContent = p.length ? p : ' ';
        txt.style.fontFamily = family;
        txt.style.fontSize = refPx(el.fontSize) + suffix;
        txt.style.lineHeight = el.lineHeight;
        txt.style.letterSpacing = refPx(el.letterSpacing) + suffix;
        txt.style.fontWeight = el.weight;
        txt.style.fontStyle = el.italic ? 'italic' : 'normal';
        txt.style.textAlign = el.align;
        txt.style.color = el.color;
        box.appendChild(txt);
      });
    } else if(el.type === 'shape'){
      applyShapeStylePrint(box, el, suffix);
    }
    trim.appendChild(box);
  });

  root.appendChild(page);
}

document.getElementById('export-pdf').addEventListener('click', () => {
  const includeBleed = state.bleed > 0 && document.getElementById('export-bleed').checked;
  buildPrintPage(includeBleed);
  exportModal.classList.remove('show');
  // Give Google Fonts / layout a beat to settle before the print
  // dialog snapshots the page (fonts requested for the first time in
  // buildPrintPage may still be loading).
  document.fonts.ready.then(() => {
    setTimeout(() => window.print(), 50);
  });
});

/* ---------------------------------------------------------------------
   THEME (dark / light) + brand dropdown
--------------------------------------------------------------------- */
const THEME_KEY = 'grid-studio-light-theme';
const SUN_ICON = '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.94" y2="5.94"/><line x1="18.06" y1="18.06" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.94" y2="18.06"/><line x1="18.06" y1="5.94" x2="19.78" y2="4.22"/>';
const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

function applyTheme(isLight){
  document.documentElement.classList.toggle('light-theme', isLight);
  document.getElementById('theme-icon').innerHTML = isLight ? MOON_ICON : SUN_ICON;
  document.getElementById('theme-label').textContent = isLight ? 'Dark mode' : 'Light mode';
}
function initTheme(){
  let isLight = false;
  try { isLight = localStorage.getItem(THEME_KEY) === '1'; } catch(e){}
  applyTheme(isLight);
}
document.getElementById('menu-light').addEventListener('click', () => {
  const isLight = !document.documentElement.classList.contains('light-theme');
  applyTheme(isLight);
  try { localStorage.setItem(THEME_KEY, isLight ? '1' : '0'); } catch(e){}
  renderStage();
});
const brandBtn = document.getElementById('brand');
const brandDropdown = document.getElementById('brand-dropdown');
brandBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  brandDropdown.classList.toggle('open');
});
document.addEventListener('click', (e) => {
  if(!brandDropdown.classList.contains('open')) return;
  if(e.target === brandBtn || brandBtn.contains(e.target) || brandDropdown.contains(e.target)) return;
  brandDropdown.classList.remove('open');
});

/* ---------------------------------------------------------------------
   PAGE VERSIONS — named snapshots of the whole page (grid + elements +
   canvas), saved to localStorage so you can branch a layout into a few
   variants and flip between them, independent of the linear undo stack.
--------------------------------------------------------------------- */
const VERSIONS_KEY = 'grid-studio-versions';
function loadVersions(){
  try { return JSON.parse(localStorage.getItem(VERSIONS_KEY) || '{}'); } catch(e){ return {}; }
}
function saveVersions(versions){
  try { localStorage.setItem(VERSIONS_KEY, JSON.stringify(versions)); } catch(e){}
}
function saveCurrentAsVersion(name){
  const versions = loadVersions();
  versions[name] = { savedAt: Date.now(), data: JSON.parse(snapshotState()) };
  saveVersions(versions);
}
function loadVersion(name){
  const versions = loadVersions();
  const v = versions[name];
  if(!v) return;
  pushHistory();
  restoreSnapshot(JSON.stringify(v.data));
  toast('Loaded "' + name + '"');
}
function deleteVersion(name){
  const versions = loadVersions();
  delete versions[name];
  saveVersions(versions);
}
function renderVersionList(){
  const list = document.getElementById('version-list');
  const empty = document.getElementById('version-empty');
  list.innerHTML = '';
  const versions = loadVersions();
  const names = Object.keys(versions).sort((a,b) => versions[b].savedAt - versions[a].savedAt);
  empty.style.display = names.length ? 'none' : 'block';
  names.forEach(name => {
    const row = document.createElement('div'); row.className = 'preset-item';
    const pname = document.createElement('span'); pname.className = 'pname'; pname.textContent = name;
    pname.addEventListener('click', () => { loadVersion(name); versionsModal.classList.remove('show'); });
    const del = document.createElement('button'); del.textContent = 'Delete';
    del.addEventListener('click', () => { deleteVersion(name); renderVersionList(); });
    row.appendChild(pname); row.appendChild(del);
    list.appendChild(row);
  });
}

const saveVersionModal = document.getElementById('save-version-modal');
const versionsModal = document.getElementById('versions-modal');
document.getElementById('menu-save-version').addEventListener('click', () => {
  brandDropdown.classList.remove('open');
  document.getElementById('version-name-input').value = '';
  saveVersionModal.classList.add('show');
  document.getElementById('version-name-input').focus();
});
document.getElementById('version-save-cancel').addEventListener('click', () => saveVersionModal.classList.remove('show'));
document.getElementById('version-save-confirm').addEventListener('click', () => {
  const name = document.getElementById('version-name-input').value.trim() || ('Version ' + new Date().toLocaleString());
  saveCurrentAsVersion(name);
  saveVersionModal.classList.remove('show');
  toast('Saved "' + name + '"');
});
document.getElementById('menu-versions').addEventListener('click', () => {
  brandDropdown.classList.remove('open');
  renderVersionList();
  versionsModal.classList.add('show');
});
document.getElementById('versions-close').addEventListener('click', () => versionsModal.classList.remove('show'));

/* ---------------------------------------------------------------------
   PROJECT SAVE / OPEN — the whole document (every page) written out as
   a portable .json file, independent of localStorage (which is tied to
   one browser). Complements page versions (quick localStorage branches)
   with a real file you can back up, move to another machine, or hand
   to someone else, and re-open exactly as left.
--------------------------------------------------------------------- */
const PROJECT_FILE_VERSION = 1;
function exportProjectFile(){
  syncCurrentPageIntoArray();
  const doc = {
    app: 'grid-studio', fileVersion: PROJECT_FILE_VERSION,
    currentPageIndex: state.currentPageIndex,
    pages: state.pages
  };
  const blob = new Blob([JSON.stringify(doc, null, 2)], { type: 'application/json' });
  downloadBlob(blob, 'grid-studio-project.json');
  toast('Project saved');
}
function importProjectFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    let doc;
    try { doc = JSON.parse(reader.result); }
    catch(e){ toast('Could not read this file'); return; }
    if(!doc || !Array.isArray(doc.pages) || !doc.pages.length){ toast('Not a Grid Studio project file'); return; }
    state.pages = doc.pages;
    state.currentPageIndex = clamp(doc.currentPageIndex || 0, 0, state.pages.length - 1);
    loadPageData(state.pages[state.currentPageIndex]);
    undoStack = []; redoStack = [];
    wInput.value = fmtDim(state.canvasW); hInput.value = fmtDim(state.canvasH); unitSelect.value = state.canvasUnit;
    applyUnitStep();
    renderAll();
    renderPageStrip();
    toast('Project loaded');
  };
  reader.readAsText(file);
}
const projectFileInput = document.getElementById('project-file-input');
document.getElementById('menu-save-project').addEventListener('click', () => {
  brandDropdown.classList.remove('open');
  exportProjectFile();
});
document.getElementById('menu-open-project').addEventListener('click', () => {
  brandDropdown.classList.remove('open');
  projectFileInput.value = '';
  projectFileInput.click();
});
projectFileInput.addEventListener('change', () => {
  const file = projectFileInput.files[0];
  if(file) importProjectFile(file);
});

document.getElementById('menu-undo').addEventListener('click', () => { brandDropdown.classList.remove('open'); undo(); });
document.getElementById('menu-redo').addEventListener('click', () => { brandDropdown.classList.remove('open'); redo(); });

/* ---------------------------------------------------------------------
   INIT
--------------------------------------------------------------------- */
function init(){
  initTheme();
  wInput.value = state.canvasW; hInput.value = state.canvasH;
  state.pages = [ capturePage('Page 1') ];
  state.currentPageIndex = 0;
  renderAll();
  renderPageStrip();
}
init();

})();
</script>
