<style>
  :root{
    --bg: #0a0a0a;
    --surface: #1a1a1a;
    --surface2: #262626;
    --border: rgba(var(--overlay-rgb),0.08);
    --border-hover: rgba(var(--overlay-rgb),0.18);
    --text: #e8e8e8;
    --text-muted: #999999;
    --text-dim: #5a5a5a;
    --accent: #e8e8e8;
    --danger: #e0584a;
    --radius: 6px;
    --radius-lg: 10px;
    --overlay-rgb: 255,255,255;
    --dropdown-bg: #262626;
    --bg-rgb: 10,10,10;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, Helvetica, Arial, sans-serif;
    --grid-line: #4F9C8F;
    --margin-line: #C15B44;
    --baseline-line: #C6A24D;
    --bleed-line: #d64d8a;
  }
  html.light-theme{
    --bg: #ececea;
    --surface: #ffffff;
    --surface2: #e2e2de;
    --border: rgba(0,0,0,0.1);
    --border-hover: rgba(0,0,0,0.22);
    --text: #1c1c1c;
    --text-muted: #6b6b6b;
    --text-dim: #a3a3a3;
    --accent: #1c1c1c;
    --danger: #c8402f;
    --overlay-rgb: 0,0,0;
    --dropdown-bg: #ffffff;
    --bg-rgb: 236,236,234;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:13px;
    overflow:hidden;
  }
  button{font-family:inherit; font-size:inherit;}
  input,select,textarea{font-family:inherit; font-size:inherit;}

  *{ scrollbar-width:thin; scrollbar-color:var(--border-hover) transparent; }
  *::-webkit-scrollbar{ width:9px; height:9px; }
  *::-webkit-scrollbar-track{ background:transparent; }
  *::-webkit-scrollbar-thumb{ background:var(--border-hover); border-radius:8px; border:2px solid var(--bg); background-clip:padding-box; }
  *::-webkit-scrollbar-thumb:hover{ background:var(--text-dim); background-clip:padding-box; }
  *::-webkit-scrollbar-corner{ background:transparent; }

  #app{ display:flex; flex-direction:column; height:100vh; width:100vw; position:relative; z-index:1; }

  #mesh-bg{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(at 12% 15%, hsla(170, 45%, 50%, 0.10) 0, transparent 48%),
      radial-gradient(at 88% 10%, hsla(20, 70%, 50%, 0.08) 0, transparent 45%),
      radial-gradient(at 80% 88%, hsla(42, 70%, 55%, 0.08) 0, transparent 50%),
      radial-gradient(at 15% 90%, hsla(170, 45%, 50%, 0.06) 0, transparent 48%);
  }
  html.light-theme #mesh-bg{
    background-image:
      radial-gradient(at 12% 15%, hsla(170, 40%, 40%, 0.08) 0, transparent 48%),
      radial-gradient(at 88% 10%, hsla(20, 60%, 42%, 0.06) 0, transparent 45%),
      radial-gradient(at 80% 88%, hsla(42, 60%, 45%, 0.06) 0, transparent 50%),
      radial-gradient(at 15% 90%, hsla(170, 40%, 40%, 0.05) 0, transparent 48%);
  }

  /* ---------- Top bar ---------- */
  #topbar{
    height:46px; flex:0 0 46px;
    display:flex; align-items:center; gap:10px;
    padding:0 12px;
    background:rgba(var(--bg-rgb),0.92);
    backdrop-filter:blur(12px);
    border-bottom:0.5px solid var(--border);
    -webkit-app-region:drag;
  }
  #brand-wrap{ position:relative; -webkit-app-region:no-drag; }
  #brand{
    display:flex; align-items:center; gap:4px;
    background:transparent; border:none; cursor:pointer;
    font:inherit; font-weight:600; letter-spacing:0.2px; color:var(--text);
    padding:4px 8px 4px 4px; margin-right:6px;
    border-radius:var(--radius); transition:background 0.15s;
    white-space:nowrap;
  }
  #brand:hover{ background:var(--surface2); }
  #brand .mark{
    display:flex; align-items:center; justify-content:center;
    width:24px; height:24px; border-radius:var(--radius);
    background:var(--surface2); color:var(--text);
  }
  #brand .mark svg{ display:block; }
  .tb-dropdown{
    display:none; flex-direction:column; gap:2px;
    position:absolute; top:calc(100% + 8px); left:0; min-width:190px;
    background:var(--dropdown-bg); border:0.5px solid var(--border-hover);
    border-radius:var(--radius); padding:6px;
    box-shadow:0 12px 28px rgba(0,0,0,0.45); z-index:300;
  }
  .tb-dropdown.open{ display:flex; }
  .tb-dropdown .tb-btn{
    width:100%; text-align:left; border-color:transparent;
    background:transparent; color:var(--text-muted); font-size:12px;
    padding:6px 8px; cursor:pointer; display:flex; align-items:center; gap:8px;
    border-radius:var(--radius); transition:background 0.15s, color 0.15s;
    text-decoration:none; box-sizing:border-box;
  }
  .tb-dropdown .tb-btn:hover{ background:var(--surface2); color:var(--text); }
  .tb-dropdown .tb-btn svg{ flex:0 0 auto; }
  .tb-sep-h{ height:0.5px; background:var(--border); margin:4px 2px; }
  .tb-shortcut{ margin-left:auto; font-size:10px; color:var(--text-dim); letter-spacing:0.02em; }
  .tb-beta{
    font-size:9px; font-weight:700; letter-spacing:0.03em; color:rgba(var(--overlay-rgb),0.55);
    padding:1px 4px; border:0.5px solid rgba(var(--overlay-rgb),0.25); border-radius:4px; flex-shrink:0;
  }

  .topbar-group{ display:flex; align-items:center; gap:6px; -webkit-app-region:no-drag; }
  .topbar-sep{ width:1px; align-self:stretch; margin:9px 0; background:var(--border); }
  #topbar label.tb-label{ color:var(--text-muted); font-size:11px; }
  .dim-field{
    width:60px; background:transparent; border:0.5px solid var(--border);
    color:var(--text); border-radius:var(--radius); padding:5px 6px;
    font-family:var(--mono); font-size:12px; text-align:right;
    transition:border-color 0.15s;
  }
  .dim-field:hover, .dim-field:focus{ outline:none; border-color:var(--border-hover); }
  #dim-x{ color:var(--text-dim); font-size:11px; }
  select.tb-select{
    background:transparent; border:0.5px solid var(--border);
    color:var(--text); border-radius:var(--radius); padding:5px 8px;
  }
  button.btn{
    background:transparent; border:0.5px solid var(--border);
    color:var(--text-muted); border-radius:var(--radius); padding:6px 11px;
    cursor:pointer; white-space:nowrap; transition:border-color 0.15s, color 0.15s, background 0.15s;
    display:flex; align-items:center; gap:6px;
  }
  button.btn:hover{ background:var(--surface2); color:var(--text); }
  button.btn.primary{ background:var(--text); border-color:var(--text); color:var(--bg); font-weight:600; }
  button.btn.primary:hover{ opacity:0.85; background:var(--text); }
  button.btn.ghost{ background:transparent; }
  button.btn:disabled{ opacity:0.4; cursor:default; }
  #spacer{ flex:1; -webkit-app-region:drag; }

  /* ---------- Main body ---------- */
  #body{ flex:1; display:flex; min-height:0; }
  #left-rail{
    width:210px; flex:0 0 210px; background:var(--surface);
    border-right:0.5px solid var(--border);
    display:flex; flex-direction:column; min-height:0;
  }
  #right-rail{
    width:320px; flex:0 0 320px; background:var(--surface);
    border-left:0.5px solid var(--border);
    display:flex; flex-direction:column; min-height:0; overflow-y:auto;
  }
  .rail-header{
    height:36px; flex:0 0 36px; display:flex; align-items:center; justify-content:space-between;
    padding:0 12px; border-bottom:0.5px solid var(--border);
    color:var(--text-muted); font-size:11px; letter-spacing:0.3px;
  }

  #stage-col{ flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; }
  #page-strip{
    flex:0 0 auto; display:flex; align-items:flex-end; gap:10px;
    padding:10px 14px; border-top:0.5px solid var(--border);
    background:var(--surface); overflow-x:auto;
  }
  .page-card{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:5px;
    cursor:pointer; position:relative; width:64px;
  }
  .page-card-thumb{
    width:64px; max-height:64px; border-radius:4px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:rgba(0,0,0,0.35); font-size:11px; font-weight:600;
    transition:border-color 0.15s; overflow:hidden;
  }
  .page-card:hover .page-card-thumb{ border-color:var(--border-hover); }
  .page-card.active .page-card-thumb{ border-color:var(--grid-line); border-width:2px; }
  .page-card-label{
    font-size:10px; color:var(--text-muted); max-width:64px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
  }
  .page-card.active .page-card-label{ color:var(--text); }
  .page-card-actions{
    position:absolute; top:-6px; right:-6px; display:none; gap:2px;
  }
  .page-card:hover .page-card-actions{ display:flex; }
  .page-card-actions button{
    width:16px; height:16px; border-radius:50%; border:0.5px solid var(--border-hover);
    background:var(--surface2); color:var(--text-muted); font-size:9px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .page-card-actions button:hover{ color:var(--text); background:var(--danger); border-color:var(--danger); color:#fff; }
  .page-card-add{
    flex:0 0 auto; width:64px; height:64px; border-radius:4px; border:1px dashed var(--border);
    background:transparent; color:var(--text-dim); font-size:18px; cursor:pointer;
    transition:border-color 0.15s, color 0.15s;
  }
  .page-card-add:hover{ border-color:var(--border-hover); color:var(--text); }

  #stage-wrap{
    flex:1; min-width:0; position:relative;
    background:
      linear-gradient(45deg, var(--surface) 25%, transparent 25%),
      linear-gradient(-45deg, var(--surface) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--surface) 75%),
      linear-gradient(-45deg, transparent 75%, var(--surface) 75%);
    background-color:var(--bg);
    background-size:22px 22px;
    background-position:0 0, 0 11px, 11px -11px, -11px 0px;
    display:flex; align-items:center; justify-content:center;
    overflow:auto; padding:36px;
  }
  #zoom-controls{
    position:absolute; right:14px; bottom:14px; z-index:10;
    display:flex; align-items:center; gap:2px;
    background:rgba(var(--bg-rgb),0.92); backdrop-filter:blur(12px);
    border:0.5px solid var(--border-hover); border-radius:var(--radius);
    padding:3px; box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  #zoom-controls button{
    width:22px; height:22px; border:none; background:transparent; color:var(--text-muted);
    cursor:pointer; border-radius:calc(var(--radius) - 2px); font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:background 0.15s, color 0.15s;
  }
  #zoom-controls button:hover{ background:var(--surface2); color:var(--text); }
  #zoom-indicator{
    width:42px; text-align:center; font-size:11px; color:var(--text-muted); cursor:pointer;
    font-family:var(--mono); user-select:none;
  }
  #zoom-indicator:hover{ color:var(--text); }
  #page{
    position:relative; box-shadow:0 0 0 1px rgba(0,0,0,0.6), 0 12px 40px rgba(0,0,0,0.5);
    background:#ffffff; overflow:hidden; flex:0 0 auto;
  }
  /* #page is the full bleed box (trim + bleed on every side); #trim-frame
     is inset within it by the bleed amount and holds the actual grid/
     elements, still positioned in plain 0..canvasW/H coordinates — only
     this wrapper's own offset changes when bleed is added, so nothing
     else in the app needs to know bleed exists. overflow stays visible
     here (unlike #page) so dragging an element into the bleed margin
     shows it there instead of clipping it away during editing. */
  #trim-frame{ position:absolute; overflow:visible; }
  #grid-overlay{ position:absolute; inset:0; pointer-events:none; display:block; overflow:visible; }
  #elements-layer{ position:absolute; inset:0; }
  #grid-handles{ position:absolute; inset:0; pointer-events:none; z-index:3; }
  .grid-handle{ position:absolute; pointer-events:auto; background:transparent; transition:background 0.1s; }
  .grid-handle:hover, .grid-handle.dragging{ background:rgba(79,156,143,0.28); }
  .grid-handle-col{ cursor:col-resize; }
  .grid-handle-row{ cursor:row-resize; }

  .el-box{
    position:absolute; cursor:move; outline:1px solid transparent;
  }
  .el-box:hover{ outline-color:rgba(79,156,143,0.55); }
  .el-box.selected{ outline:1.5px solid var(--grid-line); z-index:5; }
  .el-clip{ position:absolute; inset:0; overflow:hidden; }
  .el-box img{ width:100%; height:100%; display:block; pointer-events:none; user-select:none; -webkit-user-drag:none; }
  .el-text-clip{
    position:absolute; inset:0; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .el-text-clip.editing{ overflow:visible; }
  .el-box .el-text{
    width:100%; flex:0 0 auto; overflow:hidden; outline:none;
    white-space:pre-wrap; word-wrap:break-word;
  }
  .el-box .el-text.editing{ flex:1 1 auto; overflow:visible; }
  .el-box .el-text:focus{ box-shadow:inset 0 0 0 1px var(--grid-line); }
  .el-box.crop-mode{ cursor:grab; outline:1.5px solid var(--margin-line); z-index:5; }
  .el-box.crop-mode:active{ cursor:grabbing; }
  .el-box.crop-mode .el-handle{ display:none; }
  .el-box.crop-mode img{ pointer-events:none; }
  .crop-hint{
    position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
    background:rgba(0,0,0,0.72); color:#fff; font-size:10px; padding:4px 8px;
    border-radius:4px; white-space:nowrap; pointer-events:none; z-index:7;
  }
  .el-handle{
    position:absolute; width:9px; height:9px; background:var(--bg);
    border:1.5px solid var(--grid-line); border-radius:2px; z-index:6;
  }
  .el-handle.nw{ left:-5px; top:-5px; cursor:nwse-resize; }
  .el-handle.ne{ right:-5px; top:-5px; cursor:nesw-resize; }
  .el-handle.sw{ left:-5px; bottom:-5px; cursor:nesw-resize; }
  .el-handle.se{ right:-5px; bottom:-5px; cursor:nwse-resize; }
  .el-handle.n{ left:50%; top:-5px; margin-left:-4.5px; cursor:ns-resize; }
  .el-handle.s{ left:50%; bottom:-5px; margin-left:-4.5px; cursor:ns-resize; }
  .el-handle.w{ left:-5px; top:50%; margin-top:-4.5px; cursor:ew-resize; }
  .el-handle.e{ right:-5px; top:50%; margin-top:-4.5px; cursor:ew-resize; }

  /* ---------- Layers list ---------- */
  #layers-list{ flex:1; overflow-y:auto; padding:6px; }
  .layer-row{
    display:flex; align-items:center; gap:7px; padding:8px 8px; border-radius:var(--radius);
    margin-bottom:3px; cursor:pointer; border:1px solid transparent;
  }
  .layer-row:hover{ background:var(--surface2); }
  .layer-row.selected{ background:var(--surface2); border-color:var(--border-hover); }
  .layer-row.dragging{ background:var(--surface2); border-color:var(--grid-line); opacity:0.85; }
  .layer-grip{
    width:14px; height:20px; flex:0 0 14px; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); cursor:grab; touch-action:none;
  }
  .layer-grip:hover{ color:var(--text-muted); }
  .layer-row.dragging .layer-grip{ cursor:grabbing; color:var(--text); }
  .layer-icon{
    width:20px; height:20px; flex:0 0 20px; display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); border-radius:2px; background:var(--bg);
  }
  .layer-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .layer-name-sub{ color:var(--text-dim); font-size:10px; display:block; }
  .layer-vis-toggle{
    width:20px; height:20px; flex:0 0 20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--text-muted); border-radius:2px;
  }
  .layer-vis-toggle:hover{ color:var(--text); }
  .layer-row.disabled .layer-name{ color:var(--text-dim); }
  #add-layer-wrap{
    padding:8px; border-top:0.5px solid var(--border); display:flex; flex-direction:column; gap:5px;
  }
  .add-layer-btn{
    display:flex; align-items:center; gap:7px; background:transparent; border:1px dashed var(--border);
    color:var(--text-muted); border-radius:var(--radius); padding:7px 9px; cursor:pointer;
    text-align:left; font-size:12px; transition:border-color 0.15s, color 0.15s, background 0.15s;
  }
  .add-layer-btn:hover{ color:var(--text); border-color:var(--border-hover); background:var(--surface2); }
  .add-layer-btn .plus{ color:var(--text-muted); font-family:var(--mono); }

  /* ---------- Properties panel ---------- */
  .props-section{ padding:12px; border-bottom:0.5px solid var(--border); }
  .props-section h3{
    margin:0 0 10px 0; font-size:11px; font-weight:600; letter-spacing:0.4px;
    color:var(--text-muted); text-transform:uppercase;
  }
  .field-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:10px; }
  .field-row label{ color:var(--text-muted); flex:0 0 auto; font-size:12px; }
  .field-row .control{ flex:1; display:flex; justify-content:flex-end; }
  .field-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:9px; }
  .field-grid2 label{ display:block; color:var(--text-muted); font-size:10.5px; margin-bottom:3px; }
  .field-grid4{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:9px; }
  .field-grid4 label{ display:block; color:var(--text-muted); font-size:10.5px; margin-bottom:3px; }

  input[type="text"].name-field, input[type="text"].text-field{
    width:100%; background:transparent; border:0.5px solid var(--border);
    color:var(--text); border-radius:var(--radius); padding:6px 8px;
  }
  input[type="text"].name-field:hover, input[type="text"].name-field:focus,
  input[type="text"].text-field:hover, input[type="text"].text-field:focus{ outline:none; border-color:var(--border-hover); }

  input[type="number"].num-input, input[type="number"].num-input-full{
    background:transparent; border:0.5px solid var(--border);
    color:var(--text); border-radius:var(--radius); padding:5px 6px;
    font-family:var(--mono); font-size:11px; text-align:right;
  }
  input[type="number"].num-input{ width:60px; }
  input[type="number"].num-input-full{ width:100%; text-align:left; }
  input[type="number"].num-input:hover, input[type="number"].num-input:focus,
  input[type="number"].num-input-full:hover, input[type="number"].num-input-full:focus{ outline:none; border-color:var(--border-hover); }
  .num-combo{ display:flex; align-items:center; gap:4px; }
  .slider-row{ display:flex; align-items:center; gap:8px; width:100%; }
  .rslider{
    position:relative; flex:1; height:22px; min-width:60px;
    display:flex; align-items:center; cursor:pointer; touch-action:none;
  }
  .rslider-track{ position:relative; width:100%; height:4px; background:var(--surface2); border-radius:2px; }
  .rslider-fill{ position:absolute; top:0; left:0; height:100%; width:0%; background:var(--text-dim); border-radius:2px; pointer-events:none; }
  .rslider-thumb{
    position:absolute; top:50%; left:0%; width:14px; height:14px;
    margin-left:-7px; margin-top:-7px; border-radius:50%;
    background:var(--text); border:2px solid var(--surface); box-shadow:0 0 0 1px var(--border-hover);
    pointer-events:none;
  }
  .rslider:hover .rslider-thumb{ opacity:0.85; }
  .slider-row .num-input{ width:52px; flex:0 0 auto; }
  .stepper{ display:flex; flex-direction:column; border:0.5px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .stepper button{
    background:transparent; border:none; color:var(--text-muted); width:16px; height:11px;
    cursor:pointer; padding:0; line-height:0; display:flex; align-items:center; justify-content:center;
    font-size:8px; transition:background 0.15s, color 0.15s;
  }
  .stepper button:first-child{ border-bottom:0.5px solid var(--border); }
  .stepper button:hover{ background:var(--surface2); color:var(--text); }
  .stepper button:active{ background:var(--text); color:var(--bg); }

  select.prop-select{
    background:transparent; border:0.5px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:5px 7px; width:100%;
  }
  input[type="color"]{
    -webkit-appearance:none; appearance:none; width:26px; height:26px;
    border:0.5px solid var(--border); border-radius:var(--radius); background:transparent; cursor:pointer; padding:0;
  }
  input[type="color"]::-webkit-color-swatch{ border:none; border-radius:2px; }

  .anchor-plus{ display:grid; grid-template-columns:repeat(3,26px); grid-template-rows:repeat(3,26px); gap:3px; }
  .anchor-plus button{
    background:transparent; border:0.5px solid var(--border); border-radius:2px;
    cursor:pointer; color:var(--text-muted); display:flex; align-items:center; justify-content:center;
    font-size:11px; transition:background 0.15s, color 0.15s;
  }
  .anchor-plus button.empty{ background:transparent; border-color:transparent; cursor:default; }
  .anchor-plus button.active{ background:var(--text); border-color:var(--text); color:var(--bg); }
  .anchor-plus button:not(.empty):hover:not(.active){ color:var(--text); border-color:var(--border-hover); }

  .seg-control{ display:flex; background:var(--surface2); border:0.5px solid var(--border); border-radius:var(--radius); overflow:hidden; padding:2px; gap:2px; }
  .seg-control button{
    background:transparent; border:none; color:var(--text-muted); border-radius:calc(var(--radius) - 2px);
    padding:5px 10px; cursor:pointer; font-size:12px; flex:1;
  }
  .seg-control button.active{ background:var(--text); color:var(--bg); font-weight:600; }
  .seg-control button:hover:not(.active){ color:var(--text); }

  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-bottom:9px; cursor:pointer; }
  .checkbox-row input{ accent-color:var(--text); width:14px; height:14px; }
  .checkbox-row label{ color:var(--text-muted); font-size:12px; cursor:pointer; }

  .col-swatch-row{ display:flex; align-items:center; gap:8px; }

  #empty-props{ padding:40px 20px; text-align:center; color:var(--text-dim); font-size:12px; line-height:1.6; }

  .font-combo{ position:relative; width:100%; }
  .font-combo input{ width:100%; }
  .font-list{
    display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; max-height:220px; overflow-y:auto;
    background:var(--dropdown-bg); border:0.5px solid var(--border-hover); border-radius:var(--radius);
    box-shadow:0 12px 28px rgba(0,0,0,0.45); z-index:50; padding:4px;
  }
  .font-list.open{ display:block; }
  .font-item{ padding:6px 8px; border-radius:var(--radius); cursor:pointer; font-size:13px; color:var(--text); }
  .font-item:hover{ background:var(--surface2); }

  .danger-btn{
    width:100%; background:transparent; border:0.5px solid var(--border); color:var(--danger);
    border-radius:var(--radius); padding:8px; cursor:pointer; font-size:12px; margin-top:4px;
    transition:background 0.15s;
  }
  .danger-btn:hover{ background:rgba(224,88,74,0.1); }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(8px);
    background:var(--surface2); border:0.5px solid var(--border-hover);
    color:var(--text); padding:8px 14px; border-radius:var(--radius); font-size:12px;
    opacity:0; pointer-events:none; transition:opacity 0.2s, transform 0.2s;
    z-index:100; box-shadow:0 12px 28px rgba(0,0,0,0.35);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:200;
    display:none; align-items:center; justify-content:center;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background:var(--surface); border:1.5px solid rgba(var(--overlay-rgb),0.35);
    border-radius:var(--radius-lg); box-shadow:0 24px 60px rgba(0,0,0,0.6);
    padding:18px; width:320px; color:var(--text);
  }
  .modal h4{ margin:0 0 12px 0; font-size:13px; }
  .modal .modal-actions{ display:flex; justify-content:space-between; gap:8px; margin-top:14px; }
  .modal .modal-actions.stack{ flex-direction:column; align-items:stretch; }
  .modal .modal-actions.stack > div{ display:flex; gap:8px; }

  /* ---------- Print / PDF export ---------- */
  #print-root{ display:none; }
  @media print{
    body > *:not(#print-root){ display:none !important; }
    #print-root{ display:block !important; }
    html, body{ margin:0; padding:0; background:#fff; }
  }
  .print-page{ position:relative; overflow:hidden; }
  .print-el{ position:absolute; overflow:hidden; }
  .print-el .print-clip{ position:absolute; inset:0; overflow:hidden; }
  .print-el img{ width:100%; height:100%; display:block; }
  .print-el .print-text{
    width:100%; flex:0 0 auto; white-space:pre-wrap; word-wrap:break-word; margin:0;
  }
  .modal input[type="text"]{
    width:100%; background:transparent; border:0.5px solid var(--border);
    color:var(--text); border-radius:var(--radius); padding:7px 9px; margin-bottom:4px;
  }
  .modal input[type="text"]:hover, .modal input[type="text"]:focus{ outline:none; border-color:var(--border-hover); }
  .preset-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 4px; border-bottom:0.5px solid var(--border); font-size:12px;
  }
  .preset-item .pname{ cursor:pointer; flex:1; }
  .preset-item .pname:hover{ color:var(--text); text-decoration:underline; }
  .preset-item button{ background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:11px; }
  .preset-item button:hover{ color:var(--danger); }
  #version-list{ max-height:240px; overflow-y:auto; margin-bottom:10px; }
  #version-empty{ color:var(--text-dim); font-size:12px; padding:8px 4px; }
  .hidden-file-input{ display:none; }
</style>
</head>

        <button class="btn ghost" id="export-svg">Download SVG</button>

    <div class="modal-actions">
      <button class="btn ghost" id="versions-close">Close</button>
    </div>

<script>
(function(){
"use strict";

const SVGNS = "http://www.w3.org/2000/svg";
const HTMLNS = "http://www.w3.org/1999/xhtml";

/* ---------------------------------------------------------------------
   STATE
--------------------------------------------------------------------- */
let state = {
  canvasW: 1600,
  canvasH: 2000,
  canvasUnit: 'px',
  bgColor: '#ffffff',
  bleed: 0,
  grid: {
    marginTop: 80, marginRight: 80, marginBottom: 80, marginLeft: 80,
    cols: 6, rows: 8, gutterX: 20, gutterY: 20,
    colRatios: [1,1,1,1,1,1], rowRatios: [1,1,1,1,1,1,1,1],
    showGrid: true, showMargins: true,
    showBaseline: false, baselineStep: 24,
    locked: false,
    mode: 'modular', diagCellSize: 150, diagAngle: 45,
    phiRatio: (1 + Math.sqrt(5)) / 2, phiDepth: 2, phiAnchor: 'center'
  },
  elements: [],
  selectedId: null,
  multiSelectIds: [],
  pages: [],
  currentPageIndex: 0
};

const UNIT_TO_PX = { px: 1, mm: 96/25.4, cm: 96/2.54, in: 96 };
const EXPORT_DPI = 300;

function convertUnits(value, fromUnit, toUnit){
  if(fromUnit === toUnit) return value;
  const px = value * UNIT_TO_PX[fromUnit];
  return px / UNIT_TO_PX[toUnit];
}
// Sizes authored in reference pixels (font size, stroke widths) stay
// visually constant no matter what display unit the page is in — see
// the lesson from Phi Guide: a value stored raw in "canvas units" turns
// enormous the moment the unit switches to inches. Convert at render
// time instead of storing a unit-dependent number.
function refPx(px){ return state.canvasUnit === 'px' ? px : px / UNIT_TO_PX[state.canvasUnit]; }
function pxFromRef(canvasUnitsValue){ return state.canvasUnit === 'px' ? canvasUnitsValue : canvasUnitsValue * UNIT_TO_PX[state.canvasUnit]; }

function uid(){ return 'e' + Math.random().toString(36).slice(2,9); }
function fx(n){ return Math.round(n*100)/100; }
function round4(v){ return Math.round(v*10000)/10000; }
function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }

/* ---------------------------------------------------------------------
   HISTORY (undo / redo) — a full snapshot of the committed page state,
   pushed right before each discrete, user-intended change (a button
   click, a field commit, the moment a drag/resize gesture starts...).
   Continuous in-gesture updates never push their own snapshot — only
   the state right before the gesture began does, so one undo reverts
   the whole drag/typing session, not every intermediate pixel.
--------------------------------------------------------------------- */
let undoStack = [];
let redoStack = [];
const HISTORY_LIMIT = 60;
function snapshotState(){
  return JSON.stringify({
    canvasW: state.canvasW, canvasH: state.canvasH, canvasUnit: state.canvasUnit,
    bgColor: state.bgColor, bleed: state.bleed || 0, grid: state.grid, elements: state.elements
  });
}
function pushHistory(){
  undoStack.push(snapshotState());
  if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
  redoStack = [];
}
function restoreSnapshot(json){
  const data = JSON.parse(json);
  state.canvasW = data.canvasW; state.canvasH = data.canvasH; state.canvasUnit = data.canvasUnit;
  state.bgColor = data.bgColor; state.bleed = data.bleed || 0; state.grid = data.grid; state.elements = data.elements;
  state.selectedId = null;
  state.multiSelectIds = [];
  wInput.value = fmtDim(state.canvasW); hInput.value = fmtDim(state.canvasH); unitSelect.value = state.canvasUnit;
  applyUnitStep();
  renderAll();
}
function undo(){
  if(undoStack.length === 0){ toast('Nothing to undo'); return; }
  redoStack.push(snapshotState());
  restoreSnapshot(undoStack.pop());
  toast('Undo');
}
function redo(){
  if(redoStack.length === 0){ toast('Nothing to redo'); return; }
  undoStack.push(snapshotState());
  restoreSnapshot(redoStack.pop());
  toast('Redo');
}

/* ---------------------------------------------------------------------
   PAGES — a document is an ordered list of pages, each carrying its own
   canvas size/unit/background/bleed/grid/elements. Only the CURRENT
   page's data lives in the live `state.*` fields at any time (every
   existing function keeps reading/writing those exactly as before);
   switching pages captures the live fields back into `state.pages[i]`
   as a plain JSON snapshot, then loads the target page's snapshot into
   the live fields — the same capture/restore shape already used by
   undo/redo and page versions, just re-applied one page at a time
   instead of one history step at a time.
--------------------------------------------------------------------- */
function capturePage(name){
  return {
    name: name,
    canvasW: state.canvasW, canvasH: state.canvasH, canvasUnit: state.canvasUnit,
    bgColor: state.bgColor, bleed: state.bleed || 0,
    grid: JSON.parse(JSON.stringify(state.grid)),
    elements: JSON.parse(JSON.stringify(state.elements))
  };
}
function loadPageData(data){
  state.canvasW = data.canvasW; state.canvasH = data.canvasH; state.canvasUnit = data.canvasUnit;
  state.bgColor = data.bgColor; state.bleed = data.bleed || 0;
  state.grid = JSON.parse(JSON.stringify(data.grid));
  state.elements = JSON.parse(JSON.stringify(data.elements));
  state.selectedId = null;
  state.multiSelectIds = [];
}
// Writes the live fields back into the pages array without switching —
// called before anything reads state.pages (export/save project, page
// strip render) so that array never shows stale data for the page
// that's currently being edited.
function syncCurrentPageIntoArray(){
  if(!state.pages.length) return;
  const name = state.pages[state.currentPageIndex] ? state.pages[state.currentPageIndex].name : 'Page 1';
  state.pages[state.currentPageIndex] = capturePage(name);
}
function switchToPage(index){
  if(index < 0 || index >= state.pages.length || index === state.currentPageIndex) return;
  syncCurrentPageIntoArray();
  state.currentPageIndex = index;
  loadPageData(state.pages[index]);
  // Undo history is scoped to whichever page is being edited — carrying
  // it across a page switch would let ⌘Z silently jump to a different
  // page's past state, which is more confusing than just starting fresh.
  undoStack = []; redoStack = [];
  wInput.value = fmtDim(state.canvasW); hInput.value = fmtDim(state.canvasH); unitSelect.value = state.canvasUnit;
  applyUnitStep();
  renderAll();
  renderPageStrip();
}
function addPage(duplicateCurrent){
  syncCurrentPageIntoArray();
  const name = 'Page ' + (state.pages.length + 1);
  const data = duplicateCurrent
    ? Object.assign(capturePage(name))
    : { name, canvasW: state.canvasW, canvasH: state.canvasH, canvasUnit: state.canvasUnit,
        bgColor: state.bgColor, bleed: 0,
        grid: JSON.parse(JSON.stringify(state.grid)),
        elements: [] };
  state.pages.splice(state.currentPageIndex + 1, 0, data);
  state.currentPageIndex += 1;
  loadPageData(state.pages[state.currentPageIndex]);
  undoStack = []; redoStack = [];
  wInput.value = fmtDim(state.canvasW); hInput.value = fmtDim(state.canvasH); unitSelect.value = state.canvasUnit;
  applyUnitStep();
  renderAll();
  renderPageStrip();
  toast(duplicateCurrent ? 'Page duplicated' : 'Page added');
}
function deletePage(index){
  if(state.pages.length <= 1){ toast("Can't delete the only page"); return; }
  syncCurrentPageIntoArray();
  state.pages.splice(index, 1);
  if(state.currentPageIndex >= state.pages.length) state.currentPageIndex = state.pages.length - 1;
  else if(index < state.currentPageIndex) state.currentPageIndex -= 1;
  loadPageData(state.pages[state.currentPageIndex]);
  undoStack = []; redoStack = [];
  wInput.value = fmtDim(state.canvasW); hInput.value = fmtDim(state.canvasH); unitSelect.value = state.canvasUnit;
  applyUnitStep();
  renderAll();
  renderPageStrip();
  toast('Page deleted');
}
function movePage(index, dir){
  const target = index + dir;
  if(target < 0 || target >= state.pages.length) return;
  syncCurrentPageIntoArray();
  const tmp = state.pages[index]; state.pages[index] = state.pages[target]; state.pages[target] = tmp;
  if(state.currentPageIndex === index) state.currentPageIndex = target;
  else if(state.currentPageIndex === target) state.currentPageIndex = index;
  renderPageStrip();
}
function renamePage(index, name){
  syncCurrentPageIntoArray();
  state.pages[index].name = name || ('Page ' + (index + 1));
  renderPageStrip();
}
function renderPageStrip(){
  syncCurrentPageIntoArray();
  const strip = document.getElementById('page-strip');
  if(!strip) return;
  strip.innerHTML = '';
  state.pages.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'page-card' + (i === state.currentPageIndex ? ' active' : '');
    const thumb = document.createElement('div');
    thumb.className = 'page-card-thumb';
    thumb.style.background = p.bgColor || '#ffffff';
    thumb.style.aspectRatio = (p.canvasW||1) + ' / ' + (p.canvasH||1);
    thumb.textContent = (i+1);
    card.appendChild(thumb);
    const label = document.createElement('div');
    label.className = 'page-card-label';
    label.textContent = p.name || ('Page ' + (i+1));
    card.appendChild(label);
    card.addEventListener('click', () => switchToPage(i));
    card.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      const name = prompt('Page name', p.name || ('Page ' + (i+1)));
      if(name !== null) renamePage(i, name.trim());
    });
    const actions = document.createElement('div');
    actions.className = 'page-card-actions';
    const dupBtn = document.createElement('button'); dupBtn.title = 'Duplicate page'; dupBtn.textContent = '⧉';
    dupBtn.addEventListener('click', (e) => { e.stopPropagation(); if(i !== state.currentPageIndex) switchToPage(i); addPage(true); });
    const delBtn = document.createElement('button'); delBtn.title = 'Delete page'; delBtn.textContent = '✕';
    delBtn.addEventListener('click', (e) => { e.stopPropagation(); deletePage(i); });
    actions.appendChild(dupBtn); actions.appendChild(delBtn);
    card.appendChild(actions);
    strip.appendChild(card);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'page-card-add'; addBtn.title = 'Add page'; addBtn.textContent = '+';
  addBtn.addEventListener('click', () => addPage(false));
  strip.appendChild(addBtn);
}

/* ---------------------------------------------------------------------
   GRID GEOMETRY — Müller-Brockmann style modular grid: margins define
   the live area, which is divided into `cols` x `rows` modules
   separated by fixed gutters. Column/row boundaries double as both the
   visual guide lines AND the snap targets for placing elements — a
   block spans one or more whole modules, the way Grid Systems in
   Graphic Design intends. Row boundaries also serve as the flowlines:
   horizontal alignment points that keep unrelated blocks starting at
   the same height across the page.

   Columns/rows don't have to be equal width — colRatios/rowRatios hold
   one relative-width number per column/row (default all 1s = today's
   uniform grid). A column with ratio 2 gets twice the share of the
   available space as one with ratio 1, e.g. colRatios [1,2,1] on a
   3-column grid — the asymmetric layouts throughout Grid Systems in
   Graphic Design (a wide image column flanked by two narrow text
   columns, etc.) are exactly this.
--------------------------------------------------------------------- */
// Keeps a ratios array in sync with a column/row count: trims it down,
// or pads new entries with 1 (full width share) so a newly-added
// column/row starts equal-width rather than zero-width.
function syncRatios(arr, count){
  arr = Array.isArray(arr) ? arr : [];
  const out = arr.slice(0, count);
  while(out.length < count) out.push(1);
  return out;
}

function computeGrid(){
  const g = state.grid;
  const w = state.canvasW, h = state.canvasH;
  const innerW = Math.max(0, w - g.marginLeft - g.marginRight);
  const innerH = Math.max(0, h - g.marginTop - g.marginBottom);

  if(g.mode === 'diagonal'){
    return computeDiagonalGrid(g, w, h, innerW, innerH);
  }
  if(g.mode === 'phi'){
    return computePhiGrid(g, w, h, innerW, innerH);
  }

  const colRatios = syncRatios(g.colRatios, g.cols);
  const rowRatios = syncRatios(g.rowRatios, g.rows);

  const colGutterTotal = g.gutterX * Math.max(0, g.cols - 1);
  const availableForCols = Math.max(0, innerW - colGutterTotal);
  const colSum = colRatios.reduce((a,b) => a + Math.max(0.01, b), 0) || g.cols || 1;
  const colBounds = [];
  let cursorX = g.marginLeft;
  for(let i=0;i<g.cols;i++){
    const width = availableForCols * (Math.max(0.01, colRatios[i]) / colSum);
    colBounds.push({ start: cursorX, end: cursorX + width });
    cursorX += width + g.gutterX;
  }

  const rowGutterTotal = g.gutterY * Math.max(0, g.rows - 1);
  const availableForRows = Math.max(0, innerH - rowGutterTotal);
  const rowSum = rowRatios.reduce((a,b) => a + Math.max(0.01, b), 0) || g.rows || 1;
  const rowBounds = [];
  let cursorY = g.marginTop;
  for(let i=0;i<g.rows;i++){
    const height = availableForRows * (Math.max(0.01, rowRatios[i]) / rowSum);
    rowBounds.push({ start: cursorY, end: cursorY + height });
    cursorY += height + g.gutterY;
  }

  // Snap targets: every column/row start & end, plus the page edges.
  const snapX = new Set([0, w]);
  colBounds.forEach(c => { snapX.add(round4(c.start)); snapX.add(round4(c.end)); });
  const snapY = new Set([0, h]);
  rowBounds.forEach(r => { snapY.add(round4(r.start)); snapY.add(round4(r.end)); });

  return {
    mode: 'modular', innerW, innerH, colBounds, rowBounds,
    snapX: Array.from(snapX).sort((a,b)=>a-b),
    snapY: Array.from(snapY).sort((a,b)=>a-b)
  };
}

/* ---------------------------------------------------------------------
   DIAGONAL GRID — a square lattice rotated by `diagAngle` around the
   margin box's center, then clipped to that box — the "shop window"
   grids from Grid Systems in Graphic Design (a diamond wall of modules,
   cut off wherever it meets the page's margins). colBounds/rowBounds
   fall back to a single cell spanning the whole margin box, so the
   handful of call sites shared with the modular grid (default element
   placement, "Randomize position"...) keep working unmodified —
   diagPoints (the lattice's own intersections) is what element
   dragging actually snaps to in this mode, see startDrag().
--------------------------------------------------------------------- */
function computeDiagonalGrid(g, w, h, innerW, innerH){
  const x0 = g.marginLeft, y0 = g.marginTop, x1 = w - g.marginRight, y1 = h - g.marginBottom;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const cellSize = Math.max(4, g.diagCellSize || 150);
  const angleDeg = g.diagAngle !== undefined ? g.diagAngle : 45;
  const angleRad = angleDeg * Math.PI / 180;
  const cosA = Math.cos(angleRad), sinA = Math.sin(angleRad);
  const diagLen = Math.sqrt(Math.pow(x1-x0, 2) + Math.pow(y1-y0, 2));
  const N = Math.min(80, Math.ceil(diagLen / (2*cellSize)) + 2); // capped so a tiny cell size can't blow up the point count

  const diagPoints = [];
  const pad = cellSize * 0.15;
  for(let i=-N;i<=N;i++){
    for(let j=-N;j<=N;j++){
      const lx = i*cellSize, ly = j*cellSize;
      const rx = cx + lx*cosA - ly*sinA;
      const ry = cy + lx*sinA + ly*cosA;
      if(rx >= x0-pad && rx <= x1+pad && ry >= y0-pad && ry <= y1+pad){
        diagPoints.push({ x: rx, y: ry });
      }
    }
  }

  return {
    mode: 'diagonal', innerW, innerH,
    colBounds: [{ start: x0, end: x1 }],
    rowBounds: [{ start: y0, end: y1 }],
    snapX: [0, w, x0, x1], snapY: [0, h, y0, y1],
    diagPoints, diagCenter: { x: cx, y: cy }, diagAngle: angleDeg, diagCellSize: cellSize,
    marginBox: { x0, y0, x1, y1 }
  };
}

/* ---------------------------------------------------------------------
   PHI GRID — the golden-ratio recursive rectangle subdivision from Phi
   Guide's "Rectangle" layer (goldenDivisions1D / rectangleGridLines),
   ported as a third grid type here. Each axis of the margin box is
   split at the golden section (1-1/ratio, 1/ratio of the span); at
   depth > 1 the same split recurses into the band(s) `anchor` points
   toward. The resulting division lines become ordinary colBounds/
   rowBounds cells plus snapX/snapY — the same shape modular grid
   returns — so every existing call site (default element placement,
   drag/resize snapping, "Randomize") keeps working on this mode with
   no changes; only the boundary-drag handles and the "modular-only"
   panel sections (column/row counts, gutters) are turned off for it,
   the same way they already are for diagonal mode.
--------------------------------------------------------------------- */
const PHI_RATIO = (1 + Math.sqrt(5)) / 2;
const PHI_RATIO_PRESETS = [
  { label:'φ 1.618', value: PHI_RATIO },
  { label:'√2 1.414', value: Math.SQRT2 },
  { label:'3∶2 1.5', value: 1.5 },
  { label:'4∶3 1.333', value: 4/3 },
  { label:'16∶9 1.778', value: 16/9 }
];

// The field counts Müller-Brockmann's Grid Systems in Graphic Design
// works through (8 to 32 fields) — factored into sensible column x row
// pairs for a modular grid (not his exact book measurements, which
// vary per project; margins/gutters here are a generic ample-Swiss-
// margin default meant as a reasonable starting point, not a facsimile
// of a specific printed page from the book).
const MB_GRID_PRESETS = [
  { name: '8-field', cols: 4, rows: 2, desc: 'A simple editorial grid — four columns, two rows. Good for text-heavy layouts with a handful of image blocks.' },
  { name: '20-field', cols: 4, rows: 5, desc: 'A denser grid for mixed text/image layouts needing more vertical rhythm.' },
  { name: '32-field', cols: 4, rows: 8, desc: 'A fine modular grid in the spirit of Müller-Brockmann’s concert posters — plenty of modules for precise, geometric placement.' }
];
function goldenDivisions1D(length, ratio, depth, edgeAnchor){
  edgeAnchor = edgeAnchor || 'center';
  const positions = [];
  function recurse(start, end, d){
    const len = end - start;
    if(len <= 0) return;
    const a = start + len * (1 - 1/ratio);
    const b = start + len / ratio;
    positions.push(a, b);
    if(d > 1){
      if(edgeAnchor === 'center'){ recurse(start, a, d - 1); recurse(b, end, d - 1); }
      else if(edgeAnchor === 'start'){ recurse(start, a, d - 1); }
      else if(edgeAnchor === 'end'){ recurse(b, end, d - 1); }
    }
  }
  recurse(0, length, Math.max(1, Math.min(4, depth|0)));
  return Array.from(new Set(positions.map(v => Math.round(v*1000)/1000))).sort((x,y)=>x-y);
}
function computePhiGrid(g, w, h, innerW, innerH){
  const x0 = g.marginLeft, y0 = g.marginTop, x1 = w - g.marginRight, y1 = h - g.marginBottom;
  const ratio = g.phiRatio || PHI_RATIO;
  const depth = g.phiDepth || 2;
  const anchor = g.phiAnchor || 'center';
  const xAnchor = anchor === 'left' ? 'start' : anchor === 'right' ? 'end' : 'center';
  const yAnchor = anchor === 'top' ? 'start' : anchor === 'bottom' ? 'end' : 'center';
  const xsLocal = goldenDivisions1D(innerW, ratio, depth, xAnchor);
  const ysLocal = goldenDivisions1D(innerH, ratio, depth, yAnchor);
  const xs = [x0, ...xsLocal.map(v => v + x0), x1];
  const ys = [y0, ...ysLocal.map(v => v + y0), y1];
  const colBounds = [];
  for(let i=0;i<xs.length-1;i++) colBounds.push({ start: xs[i], end: xs[i+1] });
  const rowBounds = [];
  for(let i=0;i<ys.length-1;i++) rowBounds.push({ start: ys[i], end: ys[i+1] });
  const snapX = new Set([0, w]); xs.forEach(x => snapX.add(round4(x)));
  const snapY = new Set([0, h]); ys.forEach(y => snapY.add(round4(y)));
  return {
    mode: 'phi', innerW, innerH, colBounds, rowBounds,
    snapX: Array.from(snapX).sort((a,b)=>a-b),
    snapY: Array.from(snapY).sort((a,b)=>a-b),
    phiLinesX: xsLocal.map(v => v + x0), phiLinesY: ysLocal.map(v => v + y0),
    marginBox: { x0, y0, x1, y1 }
  };
}

function snapValue(value, targets, threshold){
  let best = value, bestDist = threshold;
  for(const t of targets){
    const d = Math.abs(t - value);
    if(d < bestDist){ bestDist = d; best = t; }
  }
  return best;
}

// Snaps a point to the nearest diagonal-lattice intersection within
// `threshold`, or returns null if none is close enough.
function snapToDiagPoint(px, py, diagPoints, threshold){
  let best = null, bestDist = threshold;
  for(const p of diagPoints){
    const d = Math.hypot(p.x - px, p.y - py);
    if(d < bestDist){ bestDist = d; best = p; }
  }
  return best;
}

// Snaps to the diagonal lattice's LINES, not just its intersections —
// each of the two rotated line families is checked independently, so a
// point close to only one line (but not near a crossing) still slides
// along it, exactly like snapping to a single guide in Figma/InDesign
// instead of only ever landing on a corner.
function snapToDiagLines(px, py, geo, threshold){
  const { diagCenter, diagAngle, diagCellSize } = geo;
  const rad = diagAngle * Math.PI/180;
  const cosA = Math.cos(rad), sinA = Math.sin(rad);
  const dx = px - diagCenter.x, dy = py - diagCenter.y;
  // world -> local (unrotated) frame, one axis per line family
  let lx = dx*cosA + dy*sinA;
  let ly = -dx*sinA + dy*cosA;

  const nearestLx = Math.round(lx/diagCellSize) * diagCellSize;
  const nearestLy = Math.round(ly/diagCellSize) * diagCellSize;
  const snappedX = Math.abs(lx - nearestLx) < threshold;
  const snappedY = Math.abs(ly - nearestLy) < threshold;
  if(!snappedX && !snappedY) return null;
  if(snappedX) lx = nearestLx;
  if(snappedY) ly = nearestLy;

  // local -> world (forward rotation)
  return {
    x: diagCenter.x + lx*cosA - ly*sinA,
    y: diagCenter.y + lx*sinA + ly*cosA
  };
}

function rotateVec(x, y, rad){
  const c = Math.cos(rad), s = Math.sin(rad);
  return { x: x*c - y*s, y: x*s + y*c };
}

// Fixed local-frame fraction of each corner handle (of the box's own
// w/h, relative to its center) — used by the rotated-resize corner
// snapping in startResize().
const CORNER_FRACS = {
  nw: { x:-0.5, y:-0.5 }, ne: { x:0.5, y:-0.5 },
  sw: { x:-0.5, y:0.5 }, se: { x:0.5, y:0.5 }
};

// Edge-handle resize (n/s/e/w) only moves ONE world-space point along
// ONE direction (the box's own local axis) — snapping that to a 2D
// lattice point doesn't make sense, so instead this projects the raw
// point onto each grid line family and, for whichever family the
// movement direction actually crosses (its dot product with that
// family's normal isn't near-zero), returns the scalar shift — along
// the movement direction — needed to land the point on the nearest
// line of that family. Returns null when nothing's close enough, or
// when movement is too oblique to either family to shift sensibly.
function snapEdgeProjected(rawWorldPoint, moveDirWorld, geo, threshold){
  const rad = geo.diagAngle * Math.PI/180;
  const gridX = { x: Math.cos(rad), y: Math.sin(rad) };
  const gridY = { x: -Math.sin(rad), y: Math.cos(rad) };
  const relX = rawWorldPoint.x - geo.diagCenter.x, relY = rawWorldPoint.y - geo.diagCenter.y;
  const projX = relX*gridX.x + relY*gridX.y;
  const projY = relX*gridY.x + relY*gridY.y;
  const dotX = moveDirWorld.x*gridX.x + moveDirWorld.y*gridX.y;
  const dotY = moveDirWorld.x*gridY.x + moveDirWorld.y*gridY.y;

  let best = null;
  if(Math.abs(dotX) > 0.35){
    const nearest = Math.round(projX/geo.diagCellSize) * geo.diagCellSize;
    const diff = nearest - projX;
    if(Math.abs(diff) < threshold){
      const shift = diff/dotX;
      if(best === null || Math.abs(shift) < Math.abs(best)) best = shift;
    }
  }
  if(Math.abs(dotY) > 0.35){
    const nearest = Math.round(projY/geo.diagCellSize) * geo.diagCellSize;
    const diff = nearest - projY;
    if(Math.abs(diff) < threshold){
      const shift = diff/dotY;
      if(best === null || Math.abs(shift) < Math.abs(best)) best = shift;
    }
  }
  return best;
}

/* ---------------------------------------------------------------------
   ELEMENTS
--------------------------------------------------------------------- */
// In diagonal mode a fresh element is centered on the lattice
// intersection nearest the margin box's middle, sized to roughly two
// grid cells, and pre-rotated to match the lattice angle — so it drops
// in already aligned with the diamond pattern instead of landing
// axis-aligned and needing to be rotated by hand every time.
function defaultDiagonalPlacement(geo, w, h){
  const anchor = geo.diagPoints.length ? snapToDiagPoint(geo.diagCenter.x, geo.diagCenter.y, geo.diagPoints, Infinity) : geo.diagCenter;
  return { x: anchor.x - w/2, y: anchor.y - h/2 };
}

function defaultImageElement(){
  const geo = computeGrid();
  let x, y, w, h;
  if(geo.mode === 'diagonal'){
    w = geo.diagCellSize * 1.6; h = geo.diagCellSize * 1.6;
    const pos = defaultDiagonalPlacement(geo, w, h);
    x = pos.x; y = pos.y;
  } else {
    const c0 = geo.colBounds[0] || {start:state.grid.marginLeft, end:state.grid.marginLeft+200};
    const c1 = geo.colBounds[Math.min(1, geo.colBounds.length-1)] || c0;
    const r0 = geo.rowBounds[0] || {start:state.grid.marginTop, end:state.grid.marginTop+200};
    const r1 = geo.rowBounds[Math.min(2, geo.rowBounds.length-1)] || r0;
    x = c0.start; y = r0.start; w = c1.end-c0.start; h = r1.end-r0.start;
  }
  return {
    id: uid(), type: 'image', name: 'Image',
    x, y, w, h,
    src: null, fit: 'cover', panX: 50, panY: 50, zoom: 1, imgRotation: 0, visible: true,
    rotation: geo.mode === 'diagonal' ? geo.diagAngle : 0
  };
}
function defaultTextElement(){
  const geo = computeGrid();
  let x, y, w, h;
  if(geo.mode === 'diagonal'){
    w = geo.diagCellSize * 1.6; h = geo.diagCellSize * 1.6;
    const pos = defaultDiagonalPlacement(geo, w, h);
    x = pos.x; y = pos.y;
  } else {
    const c0 = geo.colBounds[0] || {start:state.grid.marginLeft, end:state.grid.marginLeft+300};
    const c1 = geo.colBounds[Math.min(2, geo.colBounds.length-1)] || c0;
    const r0 = geo.rowBounds[0] || {start:state.grid.marginTop, end:state.grid.marginTop+120};
    x = c0.start; y = r0.start; w = c1.end-c0.start; h = 120;
  }
  return {
    id: uid(), type: 'text', name: 'Text',
    x, y, w, h,
    content: 'Type something', fontFamily: 'Helvetica, Arial, sans-serif',
    googleFont: '', fontSize: 24, lineHeight: 1.3, letterSpacing: 0,
    weight: 400, italic: false, align: 'left', color: '#111111', visible: true,
    autoFit: false, vAlign: 'top',
    rotation: geo.mode === 'diagonal' ? geo.diagAngle : 0
  };
}

function defaultShapeElement(shapeType){
  const geo = computeGrid();
  let x, y, w, h;
  if(geo.mode === 'diagonal'){
    w = geo.diagCellSize * 1.6; h = geo.diagCellSize * 1.6;
    const pos = defaultDiagonalPlacement(geo, w, h);
    x = pos.x; y = pos.y;
  } else {
    const c0 = geo.colBounds[0] || {start:state.grid.marginLeft, end:state.grid.marginLeft+200};
    const c1 = geo.colBounds[Math.min(1, geo.colBounds.length-1)] || c0;
    const r0 = geo.rowBounds[0] || {start:state.grid.marginTop, end:state.grid.marginTop+200};
    const r1 = geo.rowBounds[Math.min(1, geo.rowBounds.length-1)] || r0;

function addElement(el){
  pushHistory();
  state.elements.push(el);
  state.selectedId = el.id;
  renderAll();
}
function getElement(id){ return state.elements.find(e => e.id === id); }
function isElementSelected(id){
  return state.multiSelectIds.length > 1 ? state.multiSelectIds.includes(id) : id === state.selectedId;
}
// Splices the element out and heals any text-chain link broken by its
// removal — no history push, no render, so callers can batch several of
// these under a single pushHistory()/renderAll() (see deleteElement and
// deleteMultiSelected).
function removeElementById(id){
  const idx = state.elements.findIndex(e => e.id === id);
  if(idx === -1) return;
  state.elements.splice(idx, 1);
  if(state.selectedId === id) state.selectedId = null;
  // Heal any chain broken by the deletion: whoever linked into the
  // removed block stops linking anywhere (rather than silently jumping
  // to whatever it used to point past), and if that unlinks it entirely,
  // its full story text (which lived only in storyText) comes back as
  // its own visible content instead of disappearing.
  state.elements.forEach(e => {
    if(e.type === 'text' && e.linkNextId === id){
      e.linkNextId = null;
      if(!isPartOfChain(e) && e.storyText !== undefined){
        e.content = e.storyText;
        delete e.storyText;
      }
    }
  });
}
function deleteElement(id){
  if(!getElement(id)) return;
  pushHistory();
  removeElementById(id);
  renderAll();
}
function deleteMultiSelected(){
  const ids = state.multiSelectIds.slice();
  if(!ids.length) return;
  pushHistory();
  ids.forEach(removeElementById);
  state.multiSelectIds = [];
  state.selectedId = null;
  renderAll();
  toast(ids.length + ' elements deleted');
}

/* ---------------------------------------------------------------------
   LOREM IPSUM — inserted on demand per text block (never automatic),
   so it's easy to eyeball how a grid handles real paragraph lengths
   without having to type placeholder copy by hand.
--------------------------------------------------------------------- */
const LOREM_WORDS = ('lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod '+
  'tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis '+
  'nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis '+
  'aute irure in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur '+
  'excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt '+
  'mollit anim id est laborum').split(' ');
function loremIpsum(wordCount){
  const words = [];
  for(let i=0;i<wordCount;i++) words.push(LOREM_WORDS[i % LOREM_WORDS.length]);
  let s = words.join(' ') + '.';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------------------------------------------------------------------
   RANDOM PLACEMENT — snaps an element to a random module span, to
   quickly explore alternate positions/sizes within the live grid.
--------------------------------------------------------------------- */
function randomizeElementPosition(el){
  const geo = computeGrid();
  if(geo.mode === 'diagonal'){
    if(geo.diagPoints.length === 0) return;
    const anchor = geo.diagPoints[Math.floor(Math.random()*geo.diagPoints.length)];
    const span = 1 + Math.floor(Math.random()*2); // 1 or 2 cells
    const size = geo.diagCellSize * span * 0.9;
    el.w = size; el.h = size;
    el.x = anchor.x - size/2; el.y = anchor.y - size/2;
    el.rotation = geo.diagAngle;
    return;
  }
  if(geo.colBounds.length === 0 || geo.rowBounds.length === 0) return;
  const maxColSpan = Math.min(4, geo.colBounds.length);
  const maxRowSpan = Math.min(4, geo.rowBounds.length);
  const colSpan = 1 + Math.floor(Math.random()*maxColSpan);
  const rowSpan = 1 + Math.floor(Math.random()*maxRowSpan);
  const colStart = Math.floor(Math.random()*(geo.colBounds.length - colSpan + 1));
  const rowStart = Math.floor(Math.random()*(geo.rowBounds.length - rowSpan + 1));
  el.x = geo.colBounds[colStart].start;
  el.y = geo.rowBounds[rowStart].start;
  el.w = geo.colBounds[colStart+colSpan-1].end - el.x;
  el.h = geo.rowBounds[rowStart+rowSpan-1].end - el.y;
}
function shuffleAllElements(){
  if(state.elements.length === 0){ toast('No elements to shuffle'); return; }
  pushHistory();
  state.elements.forEach(el => randomizeElementPosition(el));
  renderAll();
  toast('Layout shuffled');
}

const loadedFonts = new Set();
