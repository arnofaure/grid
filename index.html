function fontStackFor(el){
  if(el.googleFont){ return `"${el.googleFont}", ${el.fontFamily || 'sans-serif'}`; }
  return el.fontFamily || 'sans-serif';
}

/* ---------------------------------------------------------------------
   STAGE — scale-to-fit + rendering
--------------------------------------------------------------------- */
let pageScale = 1;
// Extra zoom on top of the automatic scale-to-fit — 1 means "fit the
// stage" exactly as before; Cmd/Ctrl+scroll or the +/- shortcuts adjust
// it, 0 (or double-clicking the indicator) resets to fit.
let zoomMultiplier = 1;
function setZoomMultiplier(v){
  zoomMultiplier = clamp(round4(v), 0.25, 4);
  renderStage();
  const label = document.getElementById('zoom-indicator');
  if(label) label.textContent = Math.round(zoomMultiplier*100) + '%';
}

function renderStage(){
  const w = state.canvasW, h = state.canvasH;
  const bleed = state.bleed || 0;
  const page = document.getElementById('page');
  const trimFrame = document.getElementById('trim-frame');
  const wrap = document.getElementById('stage-wrap');
  const availW = wrap.clientWidth - 72;
  const availH = wrap.clientHeight - 72;
  // #page spans the full bleed box; scale-to-fit has to account for
  // that larger size too, or a big bleed would push the trim area past
  // the visible stage.
  const totalW = w + bleed*2, totalH = h + bleed*2;
  pageScale = Math.min(availW / totalW, availH / totalH, 40) * zoomMultiplier;
  page.style.width = (totalW*pageScale) + 'px';
  page.style.height = (totalH*pageScale) + 'px';
  page.style.background = state.bgColor;
  trimFrame.style.left = (bleed*pageScale) + 'px';
  trimFrame.style.top = (bleed*pageScale) + 'px';
  trimFrame.style.width = (w*pageScale) + 'px';
  trimFrame.style.height = (h*pageScale) + 'px';

  const svg = document.getElementById('grid-overlay');
  svg.setAttribute('width', w*pageScale);
  svg.setAttribute('height', h*pageScale);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  buildGridOverlaySVG(svg);
  renderGridHandles();

  renderElementPositions();
}

/* ---------------------------------------------------------------------
   GRID BOUNDARY DRAG — a thin invisible strip sits over each internal
   column/row gutter (not the outer margins, which have their own
   number fields); dragging one redistributes width/height between the
   two neighboring tracks only, converting the pixel movement back into
   their colRatios/rowRatios so the rest of the grid — and the mouse —
   never jumps. Only the SVG guides + the handles' own positions are
   touched during the drag itself (never the full renderStage/
   renderGridHandles pair), so the handle being dragged is never torn
   out from under the gesture — the same rule as element drag/resize.
--------------------------------------------------------------------- */
function renderGridHandles(){
  const layer = document.getElementById('grid-handles');
  layer.innerHTML = '';
  const g = state.grid;
  if(g.locked || g.mode === 'diagonal' || g.mode === 'phi') return; // no draggable boundaries while locked, or in diagonal/phi mode (lines are computed, not freely adjustable)
  const geo = computeGrid();
  const HIT = 10; // screen px hit-target width/height

  for(let i=0;i<geo.colBounds.length-1;i++){
    const midX = (geo.colBounds[i].end + geo.colBounds[i+1].start) / 2;
    const h = document.createElement('div');
    h.className = 'grid-handle grid-handle-col';
    h.title = 'Drag to resize these two columns';
    h.style.left = (midX*pageScale - HIT/2) + 'px';
    h.style.top = (g.marginTop*pageScale) + 'px';
    h.style.width = HIT + 'px';
    h.style.height = ((state.canvasH - g.marginBottom - g.marginTop)*pageScale) + 'px';
    h.addEventListener('pointerdown', (e) => startColumnBoundaryDrag(e, i, h));
    layer.appendChild(h);
  }
  for(let i=0;i<geo.rowBounds.length-1;i++){
    const midY = (geo.rowBounds[i].end + geo.rowBounds[i+1].start) / 2;
    const h = document.createElement('div');
    h.className = 'grid-handle grid-handle-row';
    h.title = 'Drag to resize these two rows';
    h.style.top = (midY*pageScale - HIT/2) + 'px';
    h.style.left = (g.marginLeft*pageScale) + 'px';
    h.style.height = HIT + 'px';
    h.style.width = ((state.canvasW - g.marginRight - g.marginLeft)*pageScale) + 'px';
    h.addEventListener('pointerdown', (e) => startRowBoundaryDrag(e, i, h));
    layer.appendChild(h);
  }
}

// Repositions existing handle DOM nodes from fresh grid geometry without
// recreating them — safe to call on every drag tick.
function positionGridHandles(){
  const geo = computeGrid();
  const HIT = 10;
  document.querySelectorAll('.grid-handle-col').forEach((h, i) => {
    const midX = (geo.colBounds[i].end + geo.colBounds[i+1].start) / 2;
    h.style.left = (midX*pageScale - HIT/2) + 'px';
  });
  document.querySelectorAll('.grid-handle-row').forEach((h, i) => {
    const midY = (geo.rowBounds[i].end + geo.rowBounds[i+1].start) / 2;
    h.style.top = (midY*pageScale - HIT/2) + 'px';
  });
}

function startColumnBoundaryDrag(e, index, handleEl){
  e.stopPropagation();
  const g = state.grid;
  const geo = computeGrid();
  const leftCol = geo.colBounds[index], rightCol = geo.colBounds[index+1];
  const combinedRatio = g.colRatios[index] + g.colRatios[index+1];
  const combinedWidth = (leftCol.end - leftCol.start) + (rightCol.end - rightCol.start);
  const leftStart = leftCol.start, rightEnd = rightCol.end, origBoundary = leftCol.end;
  const MIN = Math.min(10, combinedWidth * 0.05);
  const startX = e.clientX;
  let moved = false;
  handleEl.classList.add('dragging');

  function onMove(ev){
    if(!moved) pushHistory();
    moved = true;
    const dx = (ev.clientX - startX) / pageScale;
    const newBoundary = clamp(origBoundary + dx, leftStart + MIN, rightEnd - g.gutterX - MIN);
    const newWidthLeft = newBoundary - leftStart;
    const newRatioLeft = combinedRatio * (newWidthLeft / combinedWidth);
    g.colRatios[index] = round4(newRatioLeft);
    g.colRatios[index+1] = round4(combinedRatio - newRatioLeft);
    buildGridOverlaySVG(document.getElementById('grid-overlay'));
    positionGridHandles();
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    handleEl.classList.remove('dragging');
    if(moved) renderPropsPanel();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function startRowBoundaryDrag(e, index, handleEl){
  e.stopPropagation();
  const g = state.grid;
  const geo = computeGrid();
  const topRow = geo.rowBounds[index], botRow = geo.rowBounds[index+1];
  const combinedRatio = g.rowRatios[index] + g.rowRatios[index+1];
  const combinedHeight = (topRow.end - topRow.start) + (botRow.end - botRow.start);
  const topStart = topRow.start, botEnd = botRow.end, origBoundary = topRow.end;
  const MIN = Math.min(10, combinedHeight * 0.05);
  const startY = e.clientY;
  let moved = false;
  handleEl.classList.add('dragging');

  function onMove(ev){
    if(!moved) pushHistory();
    moved = true;
    const dy = (ev.clientY - startY) / pageScale;
    const newBoundary = clamp(origBoundary + dy, topStart + MIN, botEnd - g.gutterY - MIN);
    const newHeightTop = newBoundary - topStart;
    const newRatioTop = combinedRatio * (newHeightTop / combinedHeight);
    g.rowRatios[index] = round4(newRatioTop);
    g.rowRatios[index+1] = round4(combinedRatio - newRatioTop);
    buildGridOverlaySVG(document.getElementById('grid-overlay'));
    positionGridHandles();
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    handleEl.classList.remove('dragging');
    if(moved) renderPropsPanel();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function buildGridOverlaySVG(svg){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const g = state.grid;
  const geo = computeGrid();
  const w = state.canvasW, h = state.canvasH;

  // Grid/margin/baseline guides are UI chrome, not artwork — they should
  // always read as a crisp ~1 screen-pixel line no matter how far the
  // page preview is zoomed out (same convention as Figma/InDesign
  // guides). vector-effect="non-scaling-stroke" keeps stroke-width in
  // real screen pixels even though x/y coordinates stay in canvas units
  // (the viewBox does the position scaling, the stroke opts out of it).
  function line(x1,y1,x2,y2,color,width,dash){
    const el = document.createElementNS(SVGNS, 'line');
    el.setAttribute('x1', fx(x1)); el.setAttribute('y1', fx(y1));
    el.setAttribute('x2', fx(x2)); el.setAttribute('y2', fx(y2));
    el.setAttribute('stroke', color);
    el.setAttribute('stroke-width', width);
    el.setAttribute('vector-effect', 'non-scaling-stroke');
    if(dash) el.setAttribute('stroke-dasharray', dash.join(' '));
    svg.appendChild(el);
  }

  if(state.bleed > 0){
    // The trim edge — where the page actually gets cut — drawn right at
    // the SVG's own boundary; the bleed margin itself is just the extra
    // white space #page shows outside this line (see renderStage()).
    const rect = document.createElementNS(SVGNS, 'rect');
    rect.setAttribute('x', 0); rect.setAttribute('y', 0);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('fill', 'none');
    rect.setAttribute('stroke', 'var(--bleed-line)');
    rect.setAttribute('stroke-width', 1.5);
    rect.setAttribute('stroke-dasharray', '2 4');
    rect.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(rect);
  }

  if(g.showMargins){
    line(g.marginLeft, 0, g.marginLeft, h, 'var(--margin-line)', 1, [4,3]);
    line(w-g.marginRight, 0, w-g.marginRight, h, 'var(--margin-line)', 1, [4,3]);
    line(0, g.marginTop, w, g.marginTop, 'var(--margin-line)', 1, [4,3]);
    line(0, h-g.marginBottom, w, h-g.marginBottom, 'var(--margin-line)', 1, [4,3]);
  }

  if(g.showGrid && geo.mode === 'diagonal'){
    const { diagCenter, diagAngle, diagCellSize, marginBox } = geo;
    const diagLen = Math.sqrt(Math.pow(marginBox.x1-marginBox.x0,2) + Math.pow(marginBox.y1-marginBox.y0,2));
    const half = diagLen; // generous overshoot; the clipPath below trims it to the margin box
    const N = Math.min(80, Math.ceil(diagLen / (2*diagCellSize)) + 2);

    const clipId = 'diag-clip';
    const clipPath = document.createElementNS(SVGNS, 'clipPath'); clipPath.setAttribute('id', clipId);
    const clipRect = document.createElementNS(SVGNS, 'rect');
    clipRect.setAttribute('x', fx(marginBox.x0)); clipRect.setAttribute('y', fx(marginBox.y0));
    clipRect.setAttribute('width', fx(marginBox.x1-marginBox.x0)); clipRect.setAttribute('height', fx(marginBox.y1-marginBox.y0));
    clipPath.appendChild(clipRect); svg.appendChild(clipPath);

    const rotGroup = document.createElementNS(SVGNS, 'g');
    rotGroup.setAttribute('clip-path', `url(#${clipId})`);
    rotGroup.setAttribute('transform', `rotate(${fx(diagAngle)} ${fx(diagCenter.x)} ${fx(diagCenter.y)})`);
    function rotLine(x1,y1,x2,y2){
      const el = document.createElementNS(SVGNS, 'line');
      el.setAttribute('x1', fx(x1)); el.setAttribute('y1', fx(y1));
      el.setAttribute('x2', fx(x2)); el.setAttribute('y2', fx(y2));
      el.setAttribute('stroke', 'var(--grid-line)'); el.setAttribute('stroke-width', 0.75);
      el.setAttribute('vector-effect', 'non-scaling-stroke');
      rotGroup.appendChild(el);
    }
    for(let i=-N;i<=N;i++){
      const lx = diagCenter.x + i*diagCellSize;
      rotLine(lx, diagCenter.y-half, lx, diagCenter.y+half);
      const ly = diagCenter.y + i*diagCellSize;
      rotLine(diagCenter.x-half, ly, diagCenter.x+half, ly);
    }
    svg.appendChild(rotGroup);
  } else if(g.showGrid){
    geo.colBounds.forEach(c => {
      line(c.start, g.marginTop, c.start, h-g.marginBottom, 'var(--grid-line)', 0.75);
      line(c.end, g.marginTop, c.end, h-g.marginBottom, 'var(--grid-line)', 0.75);
    });
    geo.rowBounds.forEach(r => {
      line(g.marginLeft, r.start, w-g.marginRight, r.start, 'var(--grid-line)', 0.75);
      line(g.marginLeft, r.end, w-g.marginRight, r.end, 'var(--grid-line)', 0.75);
    });
  }

  if(g.showBaseline && g.baselineStep > 0){
    const stepCanvas = pxFromRef(g.baselineStep);
    for(let y = g.marginTop; y <= h-g.marginBottom+0.01; y += stepCanvas){
      line(g.marginLeft, y, w-g.marginRight, y, 'var(--baseline-line)', 0.5);
    }
  }

  svg.style.setProperty('--grid-line-resolved','1');
}

// Rotation is applied as a plain CSS transform around the box's own
// center (the default transform-origin), on top of the normal
// left/top/width/height layout — so translation (drag) stays completely
// unaffected by rotation, and only resizing needs rotation-aware math
// (see startResize).
function applyBoxTransform(box, el){
  box.style.transform = el.rotation ? `rotate(${el.rotation}deg)` : '';
}

function renderElementPositions(){
  state.elements.forEach(el => {
    const box = document.getElementById('box-' + el.id);
    if(!box) return;
    box.style.left = (el.x * pageScale) + 'px';
    box.style.top = (el.y * pageScale) + 'px';
    box.style.width = (el.w * pageScale) + 'px';
    box.style.height = (el.h * pageScale) + 'px';
    applyBoxTransform(box, el);
    if(el.type === 'shape') applyShapeStyle(box, el);
  });
}

/* ---------------------------------------------------------------------
   ELEMENTS LAYER (DOM) — rebuilt on structural changes (add/remove/
   select/reorder). Position/size updates during drag or resize are
   applied directly to style.left/top/width/height (see startDrag /
   startResize) instead of going through this rebuild, so an active
   pointer-drag never gets its own DOM element torn out from under it.
--------------------------------------------------------------------- */
function renderElements(){
  const layer = document.getElementById('elements-layer');
  layer.innerHTML = '';
  state.elements.forEach(el => {
    if(el.visible === false) return;
    const box = document.createElement('div');
    box.className = 'el-box' + (isElementSelected(el.id) ? ' selected' : '');
    box.id = 'box-' + el.id;
    box.style.left = (el.x * pageScale) + 'px';
    box.style.top = (el.y * pageScale) + 'px';
    box.style.width = (el.w * pageScale) + 'px';
    box.style.height = (el.h * pageScale) + 'px';
    applyBoxTransform(box, el);

    if(el.type === 'image'){
      if(el.src){
        // .el-box itself can't clip (its resize handles are deliberately
        // positioned outside its own edges), so the zoom/pan transform
        // needs its own overflow:hidden viewport — otherwise a zoomed-in
        // image visually spills past its frame instead of being cropped
        // to it, even though export already clips correctly.
        const clipWrap = document.createElement('div');
        clipWrap.className = 'el-clip';
        const img = document.createElement('img');
        img.src = el.src;
        applyImageStyle(img, el);
        clipWrap.appendChild(img);
        box.appendChild(clipWrap);
        box.addEventListener('dblclick', (e) => { e.stopPropagation(); toggleCropMode(el, box); });
      } else {
        box.style.background = 'repeating-linear-gradient(45deg, rgba(128,128,128,0.15), rgba(128,128,128,0.15) 8px, rgba(128,128,128,0.05) 8px, rgba(128,128,128,0.05) 16px)';
        box.style.display = 'flex'; box.style.alignItems = 'center'; box.style.justifyContent = 'center';
        box.style.color = '#888'; box.style.fontSize = '11px';
        box.textContent = 'Empty image — double-click to upload';
        box.addEventListener('dblclick', (e) => { e.stopPropagation(); pushHistory(); triggerImageUpload(el.id); });
      }
    } else if(el.type === 'text'){
      renderTextContent(box, el);
      // Single click/drag moves the block (handled by the box's own
      // pointerdown below); double-click enters edit mode, matching the
      // usual "select vs. edit" convention in design tools. While
      // editing, pointerdown on the text itself is left alone so the
      // browser can place the caret / select text instead of starting
      // a drag — see enterTextEditMode().
      box.addEventListener('dblclick', (e) => { e.stopPropagation(); enterTextEditMode(el, box); });
    } else if(el.type === 'shape'){
      applyShapeStyle(box, el);
    }

    box.addEventListener('pointerdown', (e) => onElementPointerDown(e, el));
    if(state.multiSelectIds.length <= 1 && el.id === state.selectedId){
      ['nw','n','ne','w','e','sw','s','se'].forEach(dir => {
        const h = document.createElement('div');
        h.className = 'el-handle ' + dir;
        h.addEventListener('pointerdown', (e) => { e.stopPropagation(); startResize(e, el, dir); });
        box.appendChild(h);
      });
    }

    layer.appendChild(box);
  });

  // Auto-fit needs real layout (clientWidth/Height) to measure against,
  // so it runs in a second pass once every box is actually in the DOM —
  // doing it inline above would measure a box that isn't laid out yet.
  state.elements.forEach(el => {
    if(el.type === 'text' && el.autoFit && el.visible !== false){
      const box = document.getElementById('box-' + el.id);
      if(box) autofitText(el, box);
    }
  });
}

function applyTextStyle(txt, el){
  ensureGoogleFont(el.googleFont);
  txt.style.fontFamily = fontStackFor(el);
  txt.style.fontSize = (el.fontSize * pageScale) + 'px';
  txt.style.lineHeight = el.lineHeight;
  txt.style.letterSpacing = (el.letterSpacing * pageScale) + 'px';
  txt.style.fontWeight = el.weight;
  txt.style.fontStyle = el.italic ? 'italic' : 'normal';
  txt.style.textAlign = el.align;
  txt.style.color = el.color;
}

// object-fit:cover sizes the image to exactly cover the FRAME as
// drawn — i.e. at zero rotation. Rotate that already-tightly-fitted
// image and its own edges pull away from the frame's corners (a square
// exactly inscribed in a square, spun 45°, no longer reaches the
// corners), leaving gaps — so the crop looked "stuck" at whatever
// rotation it was set up for. The fix: scale up by exactly the extra
// amount a WxH box needs to stay fully covered once rotated by
// `angleDeg` — the classic rotated-rectangle bounding-box ratio — so
// coverage is automatic and always the *minimum* necessary, which is
// what keeps the rest of the image reachable via pan/zoom instead of
// forcing an arbitrary extra crop.
function rotationCoverScale(w, h, angleDeg){
  if(!angleDeg || w <= 0 || h <= 0) return 1;
  const rad = Math.abs(angleDeg % 180) * Math.PI/180;
  const c = Math.abs(Math.cos(rad)), s = Math.abs(Math.sin(rad));
  const reqW = w*c + h*s, reqH = w*s + h*c;
  return Math.max(reqW/w, reqH/h);
}

// object-fit alone can crop (pan via object-position) but can't zoom
// past the frame's own "cover" size. Layering scale()+rotate() on top,
// anchored at the same point object-position already crops around,
// gives a real pan/zoom/rotate tool: panX/panY choose what's centered,
// zoom magnifies and imgRotation spins the PHOTO around that same
// point — the frame (el.rotation, the .el-box itself) never moves, only
// what's inside the crop does, same as Figma's "rotate an image fill"
// vs. rotating the shape holding it.
function applyImageStyle(img, el){
  img.style.objectFit = el.fit;
  img.style.objectPosition = el.panX + '% ' + el.panY + '%';
  img.style.transformOrigin = el.panX + '% ' + el.panY + '%';
  const coverScale = rotationCoverScale(el.w, el.h, el.imgRotation || 0);
  img.style.transform = 'rotate(' + (el.imgRotation || 0) + 'deg) scale(' + ((el.zoom || 1) * coverScale) + ')';
}

// Shapes are plain filled/stroked boxes — rect/ellipse/diamond are all
// the same .el-box with a different border-radius or clip-path, so
// resize/rotate/drag/snap all keep working unmodified (they only ever
// touch x/y/w/h and the rotation transform). Stroke width is stored in
// the same "reference px" convention as font size (independent of the
// canvas display unit), so it's scaled by pageScale the same way.
function applyShapeStyle(box, el){
  box.style.background = el.fillColor || 'transparent';
  const sw = (el.strokeWidth || 0) * pageScale;
  box.style.border = sw > 0.01 ? (sw + 'px solid ' + (el.strokeColor || '#000000')) : 'none';
  box.style.borderRadius = el.shapeType === 'ellipse' ? '50%' : '0';
  box.style.clipPath = el.shapeType === 'diamond' ? 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)' : 'none';
}

/* ---------------------------------------------------------------------
   TEXT CONTENT — the box itself is a flex column so vertical align is
   just justify-content. "Justify" additionally splits the stored
   content on '\n' into one flex child per line/paragraph, so
   space-between actually has multiple children to spread from the top
   edge to the bottom edge instead of collapsing to a single block
   (which is what top/middle/bottom, and space-between with only one
   child, all render as anyway).
--------------------------------------------------------------------- */
const VALIGN_CSS = { top:'flex-start', middle:'center', bottom:'flex-end', justify:'space-between' };
// Same reasoning as .el-clip for images: .el-box itself can't take
// overflow:hidden (its resize handles are deliberately positioned
// outside its own edges), so text needs its own clipping viewport —
// otherwise text longer than the box just grows past its edges
// instead of being cropped to the frame.
function getTextClip(box){
  let clip = box.querySelector('.el-text-clip');
  if(!clip){
    clip = document.createElement('div');
    clip.className = 'el-text-clip';
    box.appendChild(clip);
  }
  return clip;
}
function renderTextContent(box, el){
  const clip = getTextClip(box);
  clip.classList.remove('editing');
  clip.innerHTML = '';
  clip.style.justifyContent = VALIGN_CSS[el.vAlign] || 'flex-start';

  if(el.vAlign === 'justify'){
    const lines = (el.content || '').split('\n');
    lines.forEach(lineText => {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'el-text el-line';
      lineDiv.textContent = lineText.length ? lineText : ' '; // keep empty lines visitable/measurable
      applyTextStyle(lineDiv, el);
      clip.appendChild(lineDiv);
    });
  } else {
    const txt = document.createElement('div');
    txt.className = 'el-text';
    txt.contentEditable = 'false';
    txt.spellcheck = false;
    txt.textContent = el.content;
    applyTextStyle(txt, el);
    clip.appendChild(txt);
  }
}

// Binary-searches the largest font size (in on-screen px) that still
// keeps the text within the box, then converts it back to Grid
// Studio's reference-px convention so state stays scale-independent —
// same reasoning as strokeUnits() in Phi Guide: a size baked in at the
// current zoom/pageScale would mean something different once that
// scale changes. Grows AND shrinks (not shrink-only), so a short line
// in a big box gets genuinely large, not left at its authored size.
function autofitText(el, box){
  if(el.vAlign === 'justify') return; // see the "Auto-fit" hint in the panel
  const txt = box.querySelector('.el-text');
  if(!txt) return;
  const targetW = box.clientWidth, targetH = box.clientHeight;
  if(targetW <= 0 || targetH <= 0) return;
  let lo = 4, hi = 400;
  function fits(sizePx){
    txt.style.fontSize = sizePx + 'px';
    return txt.scrollHeight <= targetH + 0.5 && txt.scrollWidth <= targetW + 0.5;
  }
  for(let i=0;i<16;i++){
    const mid = (lo+hi)/2;
    if(fits(mid)) lo = mid; else hi = mid;
  }
  txt.style.fontSize = lo + 'px';
  el.fontSize = round4(lo / pageScale);
}

/* ---------------------------------------------------------------------
   LINKED TEXT ("threading") — a text block can name another text block
   as where its overflow continues, the way InDesign threads frames into
   one continuous story. Only the chain's HEAD (the block nobody else
   links into) is directly editable and holds the full story text, in
   el.storyText; every block in the chain — head included — always shows
   just the slice of that story which fits its own box in el.content,
   recomputed by reflowChain() whenever the story, a box's size, or its
   typography changes. A block outside any chain never gets a
   storyText field and behaves exactly as before (content == what's
   shown, directly editable).
--------------------------------------------------------------------- */
function isPartOfChain(el){
  return !!(el && el.type === 'text' && (el.linkNextId || state.elements.some(e => e.type==='text' && e.linkNextId === el.id)));
}
function isDownstreamLinked(el){
  return !!(el && el.type === 'text' && state.elements.some(e => e.type==='text' && e.linkNextId === el.id));
}
function chainHead(el){
  let cur = el, guard = 0;
  while(guard++ < 200){
    const prev = state.elements.find(e => e.type==='text' && e.linkNextId === cur.id);
    if(!prev) break;
    cur = prev;
  }
  return cur;
}
// el itself plus every block already upstream of it (walking backwards
// via linkNextId) — linking el to any of these would close a loop.
// Deliberately does NOT include el's own downstream target(s): pointing
// el at whatever it already links to (or something further down that
// same chain) is fine and must stay choosable in the panel.
function chainAncestorsInclusive(el){
  const list = [el];
  let cur = el, guard = 0;
  while(guard++ < 200){
    const prev = state.elements.find(e => e.type==='text' && e.linkNextId === cur.id);
    if(!prev || list.includes(prev)) break;
    list.push(prev); cur = prev;
  }
  return list;
}
function chainBlocks(headEl){
  const list = [headEl];
  let cur = headEl, guard = 0;
  while(cur.linkNextId && guard++ < 200){
    const next = getElement(cur.linkNextId);
    if(!next || next.type !== 'text' || list.includes(next)) break;
    list.push(next); cur = next;
  }
  return list;
}
// Binary-searches (on whole words, so a chain never splits mid-word) how
// much of `fullText` fits inside `box`'s current size at `el`'s current
// typography, using a hidden offscreen clone rather than the box's own
// text node so this can run before that node's own style is updated.
function fitTextToBox(fullText, el, box){
  const targetW = box.clientWidth, targetH = box.clientHeight;
  if(targetW <= 0 || targetH <= 0) return { shown: '', rest: fullText };
  const measurer = document.createElement('div');
  measurer.style.cssText = 'position:absolute; visibility:hidden; left:-9999px; top:-9999px; white-space:pre-wrap; word-wrap:break-word;';
  measurer.style.width = targetW + 'px';
  applyTextStyle(measurer, el);
  document.body.appendChild(measurer);
  const tokens = fullText.split(/(\s+)/); // keep separators so slices reconstruct exactly
  function textUpTo(n){ return tokens.slice(0, n).join(''); }
  function fits(n){ measurer.textContent = textUpTo(n); return measurer.scrollHeight <= targetH + 0.5; }
  let shown, rest;
  if(fits(tokens.length)){ shown = fullText; rest = ''; }
  else {
    let lo = 0, hi = tokens.length;
    while(lo < hi){
      const mid = Math.ceil((lo+hi)/2);
      if(fits(mid)) lo = mid; else hi = mid - 1;
    }
    shown = textUpTo(lo);
    rest = fullText.slice(shown.length).replace(/^\s+/, '');
  }
  document.body.removeChild(measurer);
  return { shown, rest };
}
function reflowChain(headEl){
  if(!headEl || headEl.type !== 'text') return;
  const chain = chainBlocks(headEl);
  let remaining = headEl.storyText !== undefined ? headEl.storyText : (headEl.content || '');
  chain.forEach((blockEl, i) => {
    const box = document.getElementById('box-' + blockEl.id);
    const isLast = i === chain.length - 1;
    if(isLast){
      blockEl.content = remaining;
      remaining = '';
    } else if(box){
      const { shown, rest } = fitTextToBox(remaining, blockEl, box);
      blockEl.content = shown;
      remaining = rest;
    } else {
      blockEl.content = remaining;
      remaining = '';
    }
    if(box) renderTextContent(box, blockEl);
  });
}

// Refresh only the visual styling of existing element boxes (font size,
// color, image fit...) without rebuilding the DOM — used for property
// edits so typing/dragging in the panel never fights a live interaction.
// Text is the one exception: it always rebuilds its (small) text-node
// subtree via renderTextContent, since "justify" mode needs a different
// number of child nodes depending on line count — but that never fights
// a live gesture because nothing keeps pointer capture or focus on
// those nodes outside of enterTextEditMode, which has its own path.
function refreshElementVisuals(){
  const chainHeads = new Set();
  state.elements.forEach(el => {
    const box = document.getElementById('box-' + el.id);
    if(!box) return;
    if(el.type === 'text'){
      if(isPartOfChain(el)){ chainHeads.add(chainHead(el)); return; } // reflowed together, once, below
      renderTextContent(box, el);
      if(el.autoFit) autofitText(el, box);
    } else if(el.type === 'image'){
      const img = box.querySelector('img');
      if(img) applyImageStyle(img, el);
    } else if(el.type === 'shape'){
      applyShapeStyle(box, el);
    }
  });
  chainHeads.forEach(head => reflowChain(head));
}

/* ---------------------------------------------------------------------
   TEXT EDIT MODE — a text block is normally just a draggable/resizable
   box (like an image); double-click swaps it into a single editable
   caret (merging justified lines back into one block first) so typing
   doesn't fight the drag gesture or the line-splitting, then
   blur/Escape commits the content and rebuilds the display.
--------------------------------------------------------------------- */
function enterTextEditMode(el, box){
  if(box.querySelector('.el-text.editing')) return;
  if(isDownstreamLinked(el)){
    toast('This block is linked — edit the first block in the chain instead');
    return;
  }
  pushHistory();
  const chained = isPartOfChain(el);
  const clip = getTextClip(box);
  clip.innerHTML = '';
  clip.classList.add('editing'); // lets typed text overflow visibly instead of clipping mid-edit
  clip.style.justifyContent = 'flex-start';
  const txt = document.createElement('div');
  txt.className = 'el-text editing';
  txt.contentEditable = 'true';
  txt.spellcheck = false;
  // A chain head edits its full story text (spanning every linked block
  // downstream), not just the slice reflowChain last put in its own box.
  txt.textContent = chained ? (el.storyText !== undefined ? el.storyText : el.content) : el.content;
  applyTextStyle(txt, el);
  clip.appendChild(txt);

  function stopDrag(e){ e.stopPropagation(); }
  txt.addEventListener('pointerdown', stopDrag);
  const range = document.createRange();
  range.selectNodeContents(txt);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  txt.focus();
  function finish(){
    txt.removeEventListener('pointerdown', stopDrag);
    txt.removeEventListener('blur', finish);
    // innerText mirrors the rendered line breaks (paragraphs the
    // browser inserted on Enter) — textContent would just concatenate
    // them with no separator and silently lose every line break.
    let content = txt.innerText !== undefined ? txt.innerText : txt.textContent;
    content = (content || '').replace(/\n+$/, '');
    if(chained){
      el.storyText = content;
      reflowChain(el);
    } else {
      el.content = content;
      renderTextContent(box, el);
      if(el.autoFit) autofitText(el, box);
    }
  }
  txt.addEventListener('blur', finish);
  txt.__exitEdit = finish;
}

/* ---------------------------------------------------------------------
   IMAGE PAN / ZOOM ("crop mode") — double-click an image to enter it:
   dragging inside the frame pans (panX/panY), the scroll wheel zooms
   (zoom), and Escape or clicking elsewhere exits back to normal
   select/drag/resize behavior.
--------------------------------------------------------------------- */
let activeCropEl = null;
function toggleCropMode(el, box){
  if(activeCropEl === el.id){ exitCropMode(box); return; }
  if(activeCropEl){ const prevBox = document.getElementById('box-' + activeCropEl); if(prevBox) exitCropMode(prevBox); }
  pushHistory();
  activeCropEl = el.id;
  box.classList.add('crop-mode');
  const hint = document.createElement('div');
  hint.className = 'crop-hint';
  hint.textContent = 'Drag to pan · Scroll to zoom · Shift+scroll to rotate · double-click to finish';
  box.appendChild(hint);

  function onWheel(e){
    e.preventDefault();
    if(e.shiftKey){
      const delta = e.deltaY < 0 ? -5 : 5;
      el.imgRotation = clamp(round4((el.imgRotation || 0) + delta), -180, 180);
    } else {
      const delta = e.deltaY < 0 ? 0.1 : -0.1;
      el.zoom = clamp(round4((el.zoom || 1) + delta), 1, 5);
    }
    const img = box.querySelector('img'); if(img) applyImageStyle(img, el);
    if(state.selectedId === el.id) refreshPanZoomFields();
  }
  function onPanDown(e){
    e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const origPanX = el.panX, origPanY = el.panY;
    const rect = box.getBoundingClientRect();
    const zoom = el.zoom || 1;
    function onMove(ev){
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      // Dragging the image should feel like dragging the *picture*, so
      // moving the mouse right reveals more of what's to the left of the
      // current focal point — panX decreases. Divide by zoom because at
      // higher zoom the same screen-pixel drag covers a smaller % of
      // the underlying (magnified) image.
      el.panX = clamp(round4(origPanX - (dx/rect.width)*100/zoom), 0, 100);
      el.panY = clamp(round4(origPanY - (dy/rect.height)*100/zoom), 0, 100);
      const img = box.querySelector('img'); if(img) applyImageStyle(img, el);
    }
    function onUp(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if(state.selectedId === el.id) refreshPanZoomFields();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }
  box.addEventListener('wheel', onWheel, { passive:false });
  box.addEventListener('pointerdown', onPanDown);
  box.__cropWheel = onWheel;
  box.__cropDown = onPanDown;

  function onDblClickExit(e){ e.stopPropagation(); exitCropMode(box); }
  box.__cropExitDbl = onDblClickExit;
  box.addEventListener('dblclick', onDblClickExit);
}
function exitCropMode(box){
  box.classList.remove('crop-mode');
  const hint = box.querySelector('.crop-hint'); if(hint) hint.remove();
  if(box.__cropWheel) box.removeEventListener('wheel', box.__cropWheel);
  if(box.__cropDown) box.removeEventListener('pointerdown', box.__cropDown);
  if(box.__cropExitDbl) box.removeEventListener('dblclick', box.__cropExitDbl);
  activeCropEl = null;
}
// Keep the properties-panel Pan/Zoom number fields in sync while
// dragging/scrolling inside crop mode, without rebuilding the panel.
function refreshPanZoomFields(){
  const el = getElement(state.selectedId);
  if(!el) return;
  const panXInput = document.getElementById('panx-input');
  const panYInput = document.getElementById('pany-input');
  const zoomInput = document.getElementById('zoom-input');
  const imgRotInput = document.getElementById('imgrot-input');
  if(panXInput) panXInput.value = round4(el.panX);
  if(panYInput) panYInput.value = round4(el.panY);
  if(zoomInput) zoomInput.value = round4(el.zoom);
  if(imgRotInput){
    imgRotInput.value = round4(el.imgRotation || 0);
    // imgrot-input lives inside a sliderCombo — also move the thumb,
    // not just the number, when rotation changes from outside the
    // panel (Shift+scroll in crop mode).
    const wrap = imgRotInput.closest('.slider-row');
    if(wrap && wrap.setSliderValue) wrap.setSliderValue(el.imgRotation || 0);
  }
}

/* ---------------------------------------------------------------------
   DRAG / RESIZE — direct style mutation, state written continuously,
   full DOM rebuild deferred to pointerup.
--------------------------------------------------------------------- */
const SNAP_THRESHOLD_SCREEN_PX = 8;

function onElementPointerDown(e, el){
  if(e.target.classList && e.target.classList.contains('el-handle')) return;
  const box = document.getElementById('box-' + el.id);
  if(box && box.classList.contains('crop-mode')) return; // the pan/zoom listener owns pointer input while cropping
  e.stopPropagation();
  if(e.shiftKey){
    toggleMultiSelect(el.id);
    return;
  }
  if(state.multiSelectIds.length > 1 && state.multiSelectIds.includes(el.id)){
    // Dragging any box that's part of the current multi-selection moves
    // the whole selection together, without collapsing it back to one.
    startGroupDrag(e, el);
    return;
  }
  selectElement(el.id, true);
  startDrag(e, el);
}

// Group-drag: every selected element keeps its own offset from the
// dragged (leader) box; only the leader's position is snapped to the
// grid each tick, and the same resulting delta is applied to the rest —
// simpler and more predictable than snapping every box independently.
function startGroupDrag(e, leaderEl){
  const ids = state.multiSelectIds.slice();
  const boxes = {}, origins = {};
  ids.forEach(id => {
    const el = getElement(id);
    if(!el) return;
    boxes[id] = document.getElementById('box-' + id);
    origins[id] = { x: el.x, y: el.y };
  });
  const startX = e.clientX, startY = e.clientY;
  const origLeaderX = leaderEl.x, origLeaderY = leaderEl.y;
  const geo = computeGrid();
  const thresholdX = SNAP_THRESHOLD_SCREEN_PX / pageScale;
  const thresholdY = SNAP_THRESHOLD_SCREEN_PX / pageScale;
  let moved = false;

  function onMove(ev){
    if(!moved) pushHistory();
    moved = true;
    const dx = (ev.clientX - startX) / pageScale;
    const dy = (ev.clientY - startY) / pageScale;
    let nx = origLeaderX + dx, ny = origLeaderY + dy;
    if(geo.mode === 'diagonal'){
      const centerX = nx + leaderEl.w/2, centerY = ny + leaderEl.h/2;
      const snapped = snapToDiagLines(centerX, centerY, geo, Math.max(thresholdX, thresholdY) * 1.4);
      if(snapped){ nx = snapped.x - leaderEl.w/2; ny = snapped.y - leaderEl.h/2; }
    } else {
      nx = snapValue(nx, geo.snapX, thresholdX);
      ny = snapValue(ny, geo.snapY, thresholdY);
    }
    const deltaX = nx - origLeaderX, deltaY = ny - origLeaderY;
    ids.forEach(id => {
      const el = getElement(id), box = boxes[id];
      if(!el || !box) return;
      const ex = clamp(origins[id].x + deltaX, -state.bleed, state.canvasW + state.bleed - el.w);
      const ey = clamp(origins[id].y + deltaY, -state.bleed, state.canvasH + state.bleed - el.h);
      el.x = ex; el.y = ey;
      box.style.left = (ex*pageScale) + 'px';
      box.style.top = (ey*pageScale) + 'px';
    });
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if(moved) renderPropsPanel();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function startDrag(e, el){
  const box = document.getElementById('box-' + el.id);
  const startX = e.clientX, startY = e.clientY;
  const origX = el.x, origY = el.y;
  const geo = computeGrid();
  const thresholdX = SNAP_THRESHOLD_SCREEN_PX / pageScale;
  const thresholdY = SNAP_THRESHOLD_SCREEN_PX / pageScale;
  let moved = false;

  function onMove(ev){
    if(!moved) pushHistory();
    moved = true;
    const dx = (ev.clientX - startX) / pageScale;
    const dy = (ev.clientY - startY) / pageScale;
    let nx = origX + dx, ny = origY + dy;
    if(geo.mode === 'diagonal'){
      // Snap the element's center to the diamond lattice: each of the
      // two rotated line families is checked independently, so the
      // element can slide along a single guide line (not just jump
      // between full intersections) and still locks onto a crossing
      // when it's near both at once.
      const centerX = nx + el.w/2, centerY = ny + el.h/2;
      const snapped = snapToDiagLines(centerX, centerY, geo, Math.max(thresholdX, thresholdY) * 1.4);
      if(snapped){ nx = snapped.x - el.w/2; ny = snapped.y - el.h/2; }
    } else {
      nx = snapValue(nx, geo.snapX, thresholdX);
      ny = snapValue(ny, geo.snapY, thresholdY);
    }
    nx = clamp(nx, -state.bleed, state.canvasW + state.bleed - el.w);
    ny = clamp(ny, -state.bleed, state.canvasH + state.bleed - el.h);
    el.x = nx; el.y = ny;
    box.style.left = (nx * pageScale) + 'px';
    box.style.top = (ny * pageScale) + 'px';
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if(moved) renderPropsPanel();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function startResize(e, el, dir){
  const box = document.getElementById('box-' + el.id);
  const startX = e.clientX, startY = e.clientY;
  const orig = { x: el.x, y: el.y, w: el.w, h: el.h };
  const geo = computeGrid();
  const thresholdX = SNAP_THRESHOLD_SCREEN_PX / pageScale;
  const thresholdY = SNAP_THRESHOLD_SCREEN_PX / pageScale;
  const MIN = 10;
  const rotRad = (el.rotation || 0) * Math.PI / 180;
  let resized = false;

  function onMove(ev){
    if(!resized) pushHistory();
    resized = true;
    const dx = (ev.clientX - startX) / pageScale;
    const dy = (ev.clientY - startY) / pageScale;
    let x, y, w, h;

    if(el.rotation){
      // Handles rotate with the box, so a screen-space mouse delta has
      // to be expressed in the box's own (rotated) local axes before it
      // means "wider" or "taller" — same rotate-by-minus-angle trick as
      // any 2D editor's rotated-resize.
      const oldCx = orig.x + orig.w/2, oldCy = orig.y + orig.h/2;
      let localDx = dx*Math.cos(rotRad) + dy*Math.sin(rotRad);
      let localDy = -dx*Math.sin(rotRad) + dy*Math.cos(rotRad);
      const threshold = Math.max(thresholdX, thresholdY) * 1.4;

      if(geo.mode === 'diagonal' && dir.length === 2){
        // CORNER handle: snap the dragged corner's own world position
        // to the lattice (one line, or a full intersection when close
        // to both) — the opposite corner (the anchor) never moves.
        const draggedFrac = CORNER_FRACS[dir];
        const anchorFrac = { x: -draggedFrac.x, y: -draggedFrac.y };
        const anchorOff = rotateVec(anchorFrac.x*orig.w, anchorFrac.y*orig.h, rotRad);
        const anchorWorld = { x: oldCx+anchorOff.x, y: oldCy+anchorOff.y };
        const rawDraggedLocal = { x: draggedFrac.x*orig.w + localDx, y: draggedFrac.y*orig.h + localDy };
        const rawDraggedOff = rotateVec(rawDraggedLocal.x, rawDraggedLocal.y, rotRad);
        const rawDraggedWorld = { x: oldCx+rawDraggedOff.x, y: oldCy+rawDraggedOff.y };
        const snapped = snapToDiagLines(rawDraggedWorld.x, rawDraggedWorld.y, geo, threshold) || rawDraggedWorld;
        const diffWorld = { x: snapped.x-anchorWorld.x, y: snapped.y-anchorWorld.y };
        const diffLocal = rotateVec(diffWorld.x, diffWorld.y, -rotRad);
        w = Math.max(MIN, Math.abs(diffLocal.x));
        h = Math.max(MIN, Math.abs(diffLocal.y));
        const newCenterOff = rotateVec(anchorFrac.x*w, anchorFrac.y*h, rotRad);
        x = (anchorWorld.x - newCenterOff.x) - w/2;
        y = (anchorWorld.y - newCenterOff.y) - h/2;
      } else {
        if(geo.mode === 'diagonal' && dir.length === 1){
          // EDGE handle: only one world point moves, along one axis —
          // project it onto the grid instead of full 2D point-snapping.
          const edgeIsX = (dir === 'e' || dir === 'w');
          const edgeBaseFrac = (dir === 'e' || dir === 's') ? 0.5 : -0.5;
          const rawLocalCoord = edgeIsX ? edgeBaseFrac*orig.w + localDx : edgeBaseFrac*orig.h + localDy;
          const rawLocalPoint = edgeIsX ? { x: rawLocalCoord, y: 0 } : { x: 0, y: rawLocalCoord };
          const rawOff = rotateVec(rawLocalPoint.x, rawLocalPoint.y, rotRad);
          const rawWorld = { x: oldCx+rawOff.x, y: oldCy+rawOff.y };
          const moveDirWorld = edgeIsX ? rotateVec(1,0,rotRad) : rotateVec(0,1,rotRad);
          const shift = snapEdgeProjected(rawWorld, moveDirWorld, geo, threshold);
          if(shift !== null){ if(edgeIsX) localDx += shift; else localDy += shift; }
        }
        w = orig.w; h = orig.h;
        let offX = 0, offY = 0;
        if(dir.includes('e')){ w = Math.max(MIN, orig.w + localDx); offX = (w - orig.w)/2; }
        if(dir.includes('w')){ w = Math.max(MIN, orig.w - localDx); offX = -(w - orig.w)/2; }
        if(dir.includes('s')){ h = Math.max(MIN, orig.h + localDy); offY = (h - orig.h)/2; }
        if(dir.includes('n')){ h = Math.max(MIN, orig.h - localDy); offY = -(h - orig.h)/2; }
        // offX/offY is the local-frame shift of the box's center; rotate
        // it back into canvas axes to know how the (unrotated) x/y — the
        // top-left of the un-rotated frame CSS rotates around its own
        // center — needs to move to keep the untouched edge visually put.
        const worldOff = rotateVec(offX, offY, rotRad);
        x = (oldCx + worldOff.x) - w/2; y = (oldCy + worldOff.y) - h/2;
      }
    } else {
      ({ x, y, w, h } = orig);
      if(dir.includes('e')){ let right = snapValue(orig.x+orig.w+dx, geo.snapX, thresholdX); w = Math.max(MIN, right - x); }
      if(dir.includes('s')){ let bottom = snapValue(orig.y+orig.h+dy, geo.snapY, thresholdY); h = Math.max(MIN, bottom - y); }
      if(dir.includes('w')){ let left = snapValue(orig.x+dx, geo.snapX, thresholdX); w = Math.max(MIN, (orig.x+orig.w) - left); x = left; }
      if(dir.includes('n')){ let top = snapValue(orig.y+dy, geo.snapY, thresholdY); h = Math.max(MIN, (orig.y+orig.h) - top); y = top; }
      x = clamp(x, -state.bleed, state.canvasW + state.bleed - MIN);
      y = clamp(y, -state.bleed, state.canvasH + state.bleed - MIN);
      w = clamp(w, MIN, state.canvasW + state.bleed - x);
      h = clamp(h, MIN, state.canvasH + state.bleed - y);
    }

    el.x = x; el.y = y; el.w = w; el.h = h;
    box.style.left = (x*pageScale)+'px'; box.style.top = (y*pageScale)+'px';
    box.style.width = (w*pageScale)+'px'; box.style.height = (h*pageScale)+'px';
    if(el.type === 'text'){
      const txt = box.querySelector('.el-text');
      if(txt){ applyTextStyle(txt, el); if(el.autoFit && el.vAlign !== 'justify') autofitText(el, box); }
    }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if(el.type === 'text' && isPartOfChain(el)) reflowChain(chainHead(el));
    renderPropsPanel();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

/* ---------------------------------------------------------------------
   SELECTION
--------------------------------------------------------------------- */
function selectElement(id, skipFullRender){
  state.selectedId = id;
  state.multiSelectIds = [];
  if(skipFullRender){
    applySelectionVisuals();
    renderLayersList();
    renderPropsPanel();
  } else {
    renderAll();
  }
}
// Redraws the .selected outline (and, for a single selection, the
// resize handles) from state.selectedId/multiSelectIds without
// rebuilding any box — used after both single selectElement() and
// multi-select toggling so a shift-click never tears down a box mid-drag.
function applySelectionVisuals(){
  document.querySelectorAll('.el-box').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.el-handle').forEach(h => h.remove());
  if(state.multiSelectIds.length > 1){
    state.multiSelectIds.forEach(id => {
      const box = document.getElementById('box-' + id);
      if(box) box.classList.add('selected');
    });
    return;
  }
  if(!state.selectedId) return;
  const box = document.getElementById('box-' + state.selectedId);
  if(!box) return;
  box.classList.add('selected');
  const el = getElement(state.selectedId);
  ['nw','n','ne','w','e','sw','s','se'].forEach(dir => {
    const h = document.createElement('div');
    h.className = 'el-handle ' + dir;
    h.addEventListener('pointerdown', (e) => { e.stopPropagation(); startResize(e, el, dir); });
    box.appendChild(h);
  });
}
// Shift-click a box (canvas or layer row) to add/remove it from the
// current multi-selection. Falls back to an ordinary single selection
// once membership drops to 0 or 1 — multiSelectIds only exists as a
// distinct thing while 2+ elements are actually selected together.
function toggleMultiSelect(id){
  const idx = state.multiSelectIds.indexOf(id);
  if(idx === -1){
    if(state.multiSelectIds.length === 0 && state.selectedId && state.selectedId !== id){
      state.multiSelectIds.push(state.selectedId);
    }
    state.multiSelectIds.push(id);
  } else {
    state.multiSelectIds.splice(idx, 1);
  }
  if(state.multiSelectIds.length <= 1){
    state.selectedId = state.multiSelectIds[0] || null;
    state.multiSelectIds = [];
  } else {
    state.selectedId = id;
  }
  applySelectionVisuals();
  renderLayersList();
  renderPropsPanel();
}

/* ---------------------------------------------------------------------
   LAYERS LIST (left rail)
--------------------------------------------------------------------- */
function renderLayersList(){
  const list = document.getElementById('layers-list');
  list.innerHTML = '';
  if(state.elements.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:24px 10px; color:var(--text-dim); font-size:11.5px; line-height:1.6; text-align:center;';
    empty.textContent = 'No elements yet. Add an image or a text block below.';
    list.appendChild(empty);
    return;
  }
  [...state.elements].slice().reverse().forEach(el => {
    const row = document.createElement('div');
    row.className = 'layer-row' + (isElementSelected(el.id)?' selected':'') + (el.visible===false?' disabled':'');
    row.dataset.elId = el.id;

    const grip = document.createElement('div');
    grip.className = 'layer-grip';
    grip.title = 'Drag to reorder';
    grip.innerHTML = gripSVG();
    grip.addEventListener('pointerdown', (e) => startLayerDrag(e, el.id, row));

    const icon = document.createElement('div');
    icon.className = 'layer-icon';
    icon.innerHTML = el.type === 'image' ? imageIconSVG() : el.type === 'shape' ? shapeIconSVG() : textIconSVG();

    const typeLabel = el.type === 'image' ? 'Image' : el.type === 'shape' ? 'Shape' : 'Text';
    const name = document.createElement('div');
    name.className = 'layer-name';
    name.innerHTML = escapeHtml(el.name || typeLabel) + `<span class="layer-name-sub">${typeLabel}</span>`;

    const vis = document.createElement('div');
    vis.className = 'layer-vis-toggle';
    vis.title = el.visible === false ? 'Show' : 'Hide';
    vis.innerHTML = el.visible === false ? eyeClosedSVG() : eyeOpenSVG();
    vis.addEventListener('click', (e) => { e.stopPropagation(); el.visible = el.visible === false ? true : false; renderAll(); });

    row.appendChild(grip); row.appendChild(icon); row.appendChild(name); row.appendChild(vis);
    row.addEventListener('click', (e) => { if(e.shiftKey) toggleMultiSelect(el.id); else selectElement(el.id); });
    list.appendChild(row);
  });
}
function gripSVG(){ return `<svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2" cy="2" r="1.3"/><circle cx="8" cy="2" r="1.3"/><circle cx="2" cy="7" r="1.3"/><circle cx="8" cy="7" r="1.3"/><circle cx="2" cy="12" r="1.3"/><circle cx="8" cy="12" r="1.3"/></svg>`; }

/* ---------------------------------------------------------------------
   LAYER REORDER — drag the grip to move an element up/down the stack.
   state.elements' own order IS the z-order (later = drawn on top), and
   the layers list displays it reversed (top-of-list = last in the
   array) — see the .reverse() above — so reordering the visible list
   means reordering state.elements to match. Listeners live on
   `document`, not on the grip itself via setPointerCapture, so rebuilding
   the list mid-drag (cheap, gives live visual feedback) never drops the
   gesture the way losing capture on a destroyed node would.
--------------------------------------------------------------------- */
function startLayerDrag(e, elId, row){
  e.preventDefault(); e.stopPropagation();
  const list = document.getElementById('layers-list');
  let pushed = false;
  row.classList.add('dragging');

  function displayOrder(){ return [...state.elements].slice().reverse(); }

  function onMove(ev){
    const rows = [...list.querySelectorAll('.layer-row')];
    if(rows.length < 2) return;
    let targetIndex = rows.length - 1;
    for(let i=0;i<rows.length;i++){
      const r = rows[i].getBoundingClientRect();
      if(ev.clientY < r.top + r.height/2){ targetIndex = i; break; }
    }
    const order = displayOrder();
    const curIndex = order.findIndex(el => el.id === elId);
    if(curIndex === -1 || curIndex === targetIndex) return;
    if(!pushed){ pushHistory(); pushed = true; }
    const [moved] = order.splice(curIndex, 1);
    order.splice(targetIndex, 0, moved);
    state.elements = order.slice().reverse();
    renderLayersList();
    renderElements();
    const newRow = list.querySelector(`.layer-row[data-el-id="${elId}"]`);
    if(newRow) newRow.classList.add('dragging');
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    const finalRow = list.querySelector(`.layer-row[data-el-id="${elId}"]`);
    if(finalRow) finalRow.classList.remove('dragging');
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function eyeOpenSVG(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`; }
function eyeClosedSVG(){ return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.6 21.6 0 015.06-6.06M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a21.6 21.6 0 01-2.78 3.82M14.12 14.12a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`; }
function imageIconSVG(){ return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`; }
function textIconSVG(){ return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>`; }
function shapeIconSVG(){ return `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><circle cx="17" cy="7" r="4"/><path d="M17 15l5 6H12z"/></svg>`; }

   PROPERTIES PANEL (right rail)
--------------------------------------------------------------------- */
function section(title){
  const s = document.createElement('div'); s.className = 'props-section';
  const h = document.createElement('h3'); h.textContent = title;
  s.appendChild(h); return s;
}
function fieldRow(labelText, controlEl){
  const row = document.createElement('div'); row.className = 'field-row';
  const label = document.createElement('label'); label.textContent = labelText;
  const ctrl = document.createElement('div'); ctrl.className = 'control'; ctrl.appendChild(controlEl);
  row.appendChild(label); row.appendChild(ctrl); return row;
}
// Every numCombo/checkboxRow instance across the app (grid margins,
// element position/size, font size, pan/zoom...) pushes one history
// snapshot before applying its change — wiring undo generically here
// instead of at each of the ~25 call sites.
function numCombo(value, step, min, max, onChange){
  const wrap = document.createElement('div'); wrap.className = 'num-combo';
  const num = document.createElement('input');
  num.type = 'number'; num.className = 'num-input'; num.value = round4(value);
  num.step = step; if(min!==undefined) num.min = min; if(max!==undefined) num.max = max;
  num.addEventListener('change', () => {
    let v = parseFloat(num.value); if(isNaN(v)) v = value;
    if(min!==undefined) v = Math.max(min, v); if(max!==undefined) v = Math.min(max, v);
    num.value = round4(v); pushHistory(); onChange(v);
  });
  const stepper = document.createElement('div'); stepper.className = 'stepper';
  const up = document.createElement('button'); up.type='button'; up.innerHTML='&#9650;';
  up.addEventListener('click', () => { let v = parseFloat(num.value)+step; if(max!==undefined) v=Math.min(max,v); num.value=round4(v); pushHistory(); onChange(v); });
  const down = document.createElement('button'); down.type='button'; down.innerHTML='&#9660;';
  down.addEventListener('click', () => { let v = parseFloat(num.value)-step; if(min!==undefined) v=Math.max(min,v); num.value=round4(v); pushHistory(); onChange(v); });
  stepper.appendChild(up); stepper.appendChild(down);
  wrap.appendChild(num); wrap.appendChild(stepper);
  wrap.setNum = (v) => { num.value = round4(v); };
  return wrap;
}
// A draggable slider paired with a number input that always stays in
// sync — used where dragging to "feel out" a value (like an angle)
// beats clicking a stepper, but typing an exact number must still work.
// Pointer listeners are attached only for the duration of a drag
// (pointerdown..pointerup), not kept on `document` permanently — every
// property-panel rebuild creates fresh sliders, so a listener kept
// around after mouseup would leak with every rebuild.
function sliderCombo(min, max, step, value, onChange){
  const wrap = document.createElement('div'); wrap.className = 'slider-row';

  const track = document.createElement('div'); track.className = 'rslider-track';
  const fill = document.createElement('div'); fill.className = 'rslider-fill';
  const thumb = document.createElement('div'); thumb.className = 'rslider-thumb';
  track.appendChild(fill); track.appendChild(thumb);
  const slider = document.createElement('div'); slider.className = 'rslider';
  slider.appendChild(track);

  let current = value;
  function render(){
    const p = Math.min(1, Math.max(0, (current-min)/(max-min)));
    fill.style.width = (p*100) + '%';
    thumb.style.left = (p*100) + '%';
  }
  function valueFromClientX(clientX){
    const rect = track.getBoundingClientRect();
    let p = rect.width > 0 ? (clientX-rect.left)/rect.width : 0;
    p = Math.min(1, Math.max(0, p));
    let v = min + p*(max-min);
    v = Math.round(v/step)*step;
    return Math.min(max, Math.max(min, round4(v)));
  }
  function onMove(e){
    const v = valueFromClientX(e.clientX);
    if(v !== current){ current = v; render(); num.value = round4(v); onChange(v); }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  }
  slider.addEventListener('pointerdown', (e) => {
    pushHistory();
    current = valueFromClientX(e.clientX);
    render(); num.value = round4(current); onChange(current);
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    e.preventDefault();
  });
  render();

  const num = document.createElement('input');
  num.type = 'number'; num.className = 'num-input'; num.value = round4(value);
  num.min = min; num.max = max; num.step = step;
  num.addEventListener('change', () => {
    let v = parseFloat(num.value); if(isNaN(v)) v = value;
    v = Math.min(max, Math.max(min, v));
    num.value = round4(v);
    pushHistory();
    current = v; render();
    onChange(v);
  });

  wrap.appendChild(slider); wrap.appendChild(num);
  wrap.setSliderValue = (v) => { current = v; render(); num.value = round4(v); };
  return wrap;
}

function checkboxRow(labelText, checked, onChange){
  const row = document.createElement('div'); row.className = 'checkbox-row';
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = checked;
  const id = 'cb-' + Math.random().toString(36).slice(2,8);
  cb.id = id;
  const label = document.createElement('label'); label.htmlFor = id; label.textContent = labelText;
  cb.addEventListener('change', () => { pushHistory(); onChange(cb.checked); });
  row.appendChild(cb); row.appendChild(label);
  row.addEventListener('click', (e) => { if(e.target !== cb){ cb.checked = !cb.checked; pushHistory(); onChange(cb.checked); } });
  return row;
}

function renderPropsPanel(){
  const body = document.getElementById('props-body');
  const title = document.getElementById('props-title');
  body.innerHTML = '';
  if(state.multiSelectIds.length > 1){
    title.textContent = 'SELECTION';
    body.appendChild(buildMultiSelectPanel());
    return;
  }
  const el = state.selectedId ? getElement(state.selectedId) : null;
  if(!el){
    title.textContent = 'GRID';
    body.appendChild(buildGridSection());
    return;
  }
  title.textContent = el.type.toUpperCase();
  body.appendChild(buildElementCommonSection(el));
  if(el.type === 'image') body.appendChild(buildImageSection(el));
  if(el.type === 'text') body.appendChild(buildTextSection(el));
  if(el.type === 'shape') body.appendChild(buildShapeSection(el));
  body.appendChild(buildDeleteSection(el));
}

// One small number input per column/row, editing its relative width
// share directly (default 1 = equal, like today; 2 = twice the share
// of a neighboring 1). This is what makes the asymmetric grids from
// Grid Systems in Graphic Design possible — a grid isn't just a column
// count any more, each track can carry its own weight.
function buildRatioEditor(g, ratiosKey, countKey, onEdit){
  g[ratiosKey] = syncRatios(g[ratiosKey], g[countKey]);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;';
  g[ratiosKey].forEach((val, i) => {
    const cell = document.createElement('div');
    cell.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:2px;';
    const label = document.createElement('span');
    label.textContent = i + 1;
    label.style.cssText = 'font-size:9px; color:var(--text-dim);';
    const input = document.createElement('input');
    input.type = 'number'; input.min = '0.1'; input.step = '0.1'; input.value = round4(val);
    input.className = 'num-input'; input.style.width = '42px';
    input.addEventListener('change', () => {
      let v = parseFloat(input.value); if(isNaN(v) || v <= 0) v = 1;
      pushHistory();
      g[ratiosKey][i] = v;
      input.value = round4(v);
      onEdit();
    });
    cell.appendChild(label); cell.appendChild(input);
    wrap.appendChild(cell);
  });
  return wrap;
}

// Greys out and disables every input/button/select inside a section —
// used to freeze the grid's geometry controls while locked, so a stray
// click or drag can't reshape columns/rows/margins/gutters mid-project.
// Visibility toggles (Display section) are deliberately left out of
// this, since showing/hiding guides isn't "changing the grid".
function lockSection(sectionEl){
  sectionEl.querySelectorAll('input, button, select').forEach(el => { el.disabled = true; });
  sectionEl.style.opacity = '0.45';
  sectionEl.style.pointerEvents = 'none';
}

// Center = symmetric (default). Top/Bottom bias the Y-axis subdivision,
// Left/Right bias the X-axis subdivision — same reference-point picker
// as Phi Guide's rectangle layer, ported for the Phi grid's `phiAnchor`.
function buildPhiAnchorSelector(g){
  const grid = document.createElement('div');
  grid.className = 'anchor-plus';
  const cells = [
    {key:null},          {key:'top', label:'&#8593;', title:'Top'},           {key:null},
    {key:'left', label:'&#8592;', title:'Left'}, {key:'center', label:'&#8226;', title:'Center'}, {key:'right', label:'&#8594;', title:'Right'},
    {key:null},          {key:'bottom', label:'&#8595;', title:'Bottom'},     {key:null}
  ];
  cells.forEach(cell => {
    const b = document.createElement('button');
    if(cell.key === null){ b.className = 'empty'; b.tabIndex = -1; grid.appendChild(b); return; }
    b.innerHTML = cell.label;
    b.title = cell.title;
    b.className = (g.phiAnchor || 'center') === cell.key ? 'active' : '';
    b.addEventListener('click', () => { pushHistory(); g.phiAnchor = cell.key; renderAll(); });
    grid.appendChild(b);
  });
  return grid;
}

function clampElementsToPage(){
  const bleed = state.bleed || 0;
  state.elements.forEach(el => {
    el.w = Math.min(el.w, state.canvasW + bleed*2);
    el.h = Math.min(el.h, state.canvasH + bleed*2);
    el.x = clamp(el.x, -bleed, state.canvasW + bleed - el.w);
    el.y = clamp(el.y, -bleed, state.canvasH + bleed - el.h);
  });
}

// WCAG 2.x relative-luminance contrast ratio between two hex colors —
// used to warn when a text block's color is hard to read against the
// page background (the one thing GRID-APP can actually know is behind
// it; an image or shape underneath isn't accounted for).
function hexToRgb(hex){
  hex = (hex || '#000000').replace('#','');
  if(hex.length === 3) hex = hex.split('').map(c => c+c).join('');
  const num = parseInt(hex, 16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function relLuminance(hex){
  const { r, g, b } = hexToRgb(hex);
  const [rl, gl, bl] = [r, g, b].map(c => {
    c = c/255;
    return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  });
  return 0.2126*rl + 0.7152*gl + 0.0722*bl;
}
function contrastRatio(hexA, hexB){
  const l1 = relLuminance(hexA), l2 = relLuminance(hexB);
  const lighter = Math.max(l1, l2), darker = Math.min(l1, l2);
  return (lighter + 0.05) / (darker + 0.05);
}

/* ---------------------------------------------------------------------
   MULTI-SELECT — align/distribute act on the bounding box of every
   currently multi-selected element; alignment moves each element flush
   to that shared box's edge/center, distribution (3+ elements only)
   equalizes the gaps between their edges along one axis, sorted by
   current position so the two extremes stay put and everything between
   spaces out evenly.
--------------------------------------------------------------------- */
function selectionBounds(ids){
  const els = ids.map(getElement).filter(Boolean);
  return {
    minX: Math.min(...els.map(e => e.x)), minY: Math.min(...els.map(e => e.y)),
    maxX: Math.max(...els.map(e => e.x + e.w)), maxY: Math.max(...els.map(e => e.y + e.h))
  };
}
function alignSelection(kind){
  const ids = state.multiSelectIds;
  const els = ids.map(getElement).filter(Boolean);
  if(els.length < 2) return;
  pushHistory();
  const b = selectionBounds(ids);
  const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2;
  els.forEach(el => {
    if(kind === 'left') el.x = b.minX;
    else if(kind === 'hcenter') el.x = cx - el.w/2;
    else if(kind === 'right') el.x = b.maxX - el.w;
    else if(kind === 'top') el.y = b.minY;
    else if(kind === 'vcenter') el.y = cy - el.h/2;
    else if(kind === 'bottom') el.y = b.maxY - el.h;
  });
  clampElementsToPage();
  renderAll();
}
function distributeSelection(axis){
  let els = state.multiSelectIds.map(getElement).filter(Boolean);
  if(els.length < 3){ toast('Select at least 3 elements to distribute'); return; }
  pushHistory();
  if(axis === 'h'){
    els = els.slice().sort((a,b) => a.x - b.x);
    const first = els[0], last = els[els.length-1];
    const totalSpan = (last.x + last.w) - first.x;
    const totalW = els.reduce((s,e) => s + e.w, 0);
    const gap = (totalSpan - totalW) / (els.length - 1);
    let cursor = first.x + first.w + gap;
    for(let i=1;i<els.length-1;i++){ els[i].x = cursor; cursor += els[i].w + gap; }
  } else {
    els = els.slice().sort((a,b) => a.y - b.y);
    const first = els[0], last = els[els.length-1];
    const totalSpan = (last.y + last.h) - first.y;
    const totalH = els.reduce((s,e) => s + e.h, 0);
    const gap = (totalSpan - totalH) / (els.length - 1);
    let cursor = first.y + first.h + gap;
    for(let i=1;i<els.length-1;i++){ els[i].y = cursor; cursor += els[i].h + gap; }
  }
  clampElementsToPage();
  renderAll();
}
function buildMultiSelectPanel(){
  const wrap = document.createElement('div');
  const s = section(state.multiSelectIds.length + ' elements selected');

  const alignHRow = document.createElement('div'); alignHRow.className = 'seg-control';
  [['left','⇤ Left'],['hcenter','↔ Center'],['right','Right ⇥']].forEach(([k,label]) => {
    const b = document.createElement('button'); b.textContent = label;
    b.addEventListener('click', () => alignSelection(k));
    alignHRow.appendChild(b);
  });
  s.appendChild(fieldRow('Align horizontal', alignHRow));

  const alignVRow = document.createElement('div'); alignVRow.className = 'seg-control';
  [['top','Top'],['vcenter','Middle'],['bottom','Bottom']].forEach(([k,label]) => {
    const b = document.createElement('button'); b.textContent = label;
    b.addEventListener('click', () => alignSelection(k));
    alignVRow.appendChild(b);
  });
  s.appendChild(fieldRow('Align vertical', alignVRow));

  const distRow = document.createElement('div'); distRow.style.cssText = 'display:flex; gap:8px; margin-top:4px;';
  const distH = document.createElement('button'); distH.className = 'btn ghost'; distH.style.cssText = 'flex:1; justify-content:center;';
  distH.textContent = 'Distribute ↔'; distH.title = 'Equalize horizontal gaps (3+ elements)';
  distH.addEventListener('click', () => distributeSelection('h'));
  const distV = document.createElement('button'); distV.className = 'btn ghost'; distV.style.cssText = 'flex:1; justify-content:center;';
  distV.textContent = 'Distribute ↕'; distV.title = 'Equalize vertical gaps (3+ elements)';
  distV.addEventListener('click', () => distributeSelection('v'));
  distRow.appendChild(distH); distRow.appendChild(distV);
  s.appendChild(distRow);

  const hint = document.createElement('div');
  hint.style.cssText = 'color:var(--text-dim); font-size:10.5px; line-height:1.5; margin-top:8px;';
  hint.textContent = 'Drag any one of them to move the whole selection together. Arrow keys nudge by 1px (Shift 10px). Shift-click a box (or a layer) to add/remove it from the selection.';
  s.appendChild(hint);
  wrap.appendChild(s);

  const del = document.createElement('div'); del.className = 'props-section';
  const delBtn = document.createElement('button'); delBtn.className = 'danger-btn';
  delBtn.textContent = 'Delete ' + state.multiSelectIds.length + ' elements';
  delBtn.addEventListener('click', () => deleteMultiSelected());
  del.appendChild(delBtn);
  wrap.appendChild(del);

  return wrap;
}

const wInput = document.getElementById('canvas-w');

const UNIT_STEP = { px: '1', mm: '0.1', cm: '0.1', in: '0.01' };

function fmtDim(v){ return state.canvasUnit === 'px' ? Math.round(v) : round4(v); }

// Every geometric value that lives in canvas units — page size, grid
// margins/gutters, and every element's x/y/w/h — must be converted
// together when the display unit changes. Missing even one of these
// (as happened earlier with Phi Guide's stroke width) leaves that value
// meaning something completely different once the unit flips.
unitSelect.addEventListener('change', () => {
  const newUnit = unitSelect.value;
  const from = state.canvasUnit;
  const conv = (v) => round4(convertUnits(v, from, newUnit));
  state.canvasW = conv(state.canvasW); state.canvasH = conv(state.canvasH);
  const g = state.grid;
  g.marginTop = conv(g.marginTop); g.marginRight = conv(g.marginRight);
  g.marginBottom = conv(g.marginBottom); g.marginLeft = conv(g.marginLeft);
  g.gutterX = conv(g.gutterX); g.gutterY = conv(g.gutterY);
  state.bleed = conv(state.bleed || 0);
  state.elements.forEach(el => { el.x = conv(el.x); el.y = conv(el.y); el.w = conv(el.w); el.h = conv(el.h); });
  state.canvasUnit = newUnit;
  wInput.value = fmtDim(state.canvasW); hInput.value = fmtDim(state.canvasH);
  applyUnitStep();
  renderAll();
});

document.getElementById('preset-size').addEventListener('change', (e) => {

  g.marginBottom = conv(g.marginBottom); g.marginLeft = conv(g.marginLeft);
  g.gutterX = conv(g.gutterX); g.gutterY = conv(g.gutterY);
